# Starter set: Turn the Dial. The set a radio ships with when nobody chose
# another (haslerd/presets.py DEFAULT_PACK): a crowd-pleaser that keeps
# surprising - live radio from three continents beside YouTube Music. Key 3 is
# a station, not a list (the owner's choice, 2026-11-07).
#
# Every entry names one of: `station:` (an id from config/stations/collection.json;
# the stream URL comes from there) or `ytm:` (a YouTube Music list id as
# config/catalog/catalog.json stores it in the item's link). `short` is the
# key-cap label (12 characters at most); `why` is the one line the key card
# can print. Key 7 is the Excelsior's Tape key; the HM has six. `group` is the
# heading the "Start from a set" sheet lists the set under: an occasion, never
# an age (Every day, For a mood, Go somewhere, Family time).
pack: dial
title: "Turn the Dial"
group: "Every day"
blurb: "Paris, Switzerland, Madrid, Havana and a beach in Japan, a key apart, with the feel-good songs everyone knows."
presets:
  - {n: 1, name: "FIP", short: "FIP", station: fr-fip,
     why: "Radio France's eclectic channel: jazz, pop, world, hardly a word spoken. The key everyone agrees on."}
  - {n: 2, name: "Radio Swiss Jazz", short: "Swiss Jazz", station: ch-radio-swiss-jazz,
     why: "Jazz around the clock from the cabinet's homeland, no presenters."}
  - {n: 3, name: "RNE Radio 3", short: "Radio 3", station: es-rne-radio-3,
     why: "Spain's music station since 1979: indie, jazz, world and the odd surprise, live from Madrid."}
  - {n: 4, name: "Shonan Beach FM", short: "Shonan Beach", station: jp-shonan-beach-fm-78-9,
     why: "A little community station on a Japanese beach: jazz, bossa and AOR. Sunday afternoon, any day."}
  - {n: 5, name: "Buena Vista Social Club radio", short: "Buena Vista", ytm: RDEMkIlmPguUoTgHzbw6yV9n_g,
     why: "Start with Havana's old masters and let it wander: an artist radio that never runs out."}
  - {n: 6, name: "Classic Feel-Good Pop", short: "Feel-Good", ytm: RDCLAK5uy_k4sXYMRc7kePx3BjjVv5z2fB1CePqvVDw,
     why: "The songs the whole room sings along to, one after another. Press again to skip."}
  - {n: 7, name: "KEXP", short: "KEXP", station: us-kexp-90-3-seattle,
     why: "Seattle's listener-powered station: new music and live sessions."}
