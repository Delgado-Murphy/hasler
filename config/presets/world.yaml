# Starter set: World & travel (the format: eclectic.yaml). A trip on the
# keys: fado, the Balkans, Ethiopia, Brazil, Buenos Aires, Jamaica.
pack: world
title: "World & travel"
group: "Grown-ups"
blurb: "A trip round the world: fado, Balkan brass, Ethiopian soul, bossa nova and tango."
presets:
  - {n: 1, name: "FIP Monde", short: "FIP Monde", station: fr-fip-monde,
     why: "Radio France's world channel: Africa, Brazil, Asia, the Balkans, hardly a word."}
  - {n: 2, name: "Amália Rodrigues radio", short: "Fado", ytm: RDEME57zQmiWw8Qt3SWu3xOuWQ,
     why: "Start with the queen of fado and drift through Lisbon: an endless radio."}
  - {n: 3, name: "Goran Bregović radio", short: "Balkan", ytm: RDEMEx6UxuUwxEogVj8P6v7x-g,
     why: "Brass bands and wedding songs from the Balkans, without end."}
  - {n: 4, name: "Ethio Oldies", short: "Ethiopia", station: et-ethio-oldies,
     why: "The golden age of Ethiopian soul and jazz, Mulatu to Mahmoud Ahmed."}
  - {n: 5, name: "Bossa Nova Time", short: "Bossa Nova", ytm: RDCLAK5uy_n3QuG8R7-PdIR0VmWV_yUIPtwbDDmlMqg,
     why: "Brazil, softly: bossa nova from the beaches of Rio. Tap again to skip."}
  - {n: 6, name: "La 2x4", short: "Tango", station: ar-la-2x4,
     why: "Buenos Aires's own all-tango station, live from the city."}
  - {n: 7, name: "Irie FM", short: "Irie FM", station: jm-irie-fm-107-7,
     why: "The world's first all-reggae station, from Ocho Rios, Jamaica."}
