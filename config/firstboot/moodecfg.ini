; Hasler: moOde settings for a new radio (docs/new-install.md).
; hasler-install copies this to /boot/moodecfg.ini once; moOde's worker applies
; it at its next start (log: /var/log/moode_autocfg.log), deletes it and
; restarts. Keys: moOde's www/inc/autocfg.php (r1036). No Wi-Fi here - Raspberry
; Pi Imager set that up.
;
; Audio: the HiFiBerry Amp4 Pro by its overlay (it is not in moOde's device
; list). Hasler sends the sound to it by card name (sndrpihifiberry) through
; its mono/tone chain, whatever moOde shows as its output device.
i2sdevice = "None"
i2soverlay = "hifiberry-amp4pro"
mpdmixer = "hardware"
; moOde's own volume slider stays below the speaker's limit (slider 100 = -10.5 dB);
; the radio's knob is capped by its volume ceiling on the key page.
volume_mpd_max = "67"
autoplay = "0"
; Casting. Spotify Connect stays OFF in moOde: the radio's own go-librespot is
; the Spotify player and shares the amp.
btsvc = "1"
btname = "Hasler"
airplaysvc = "1"
airplayname = "Hasler"
upnpsvc = "1"
upnpname = "Hasler"
spotifysvc = "0"
browsertitle = "Hasler Player"
