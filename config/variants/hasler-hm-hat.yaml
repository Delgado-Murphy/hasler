# Hasler HM (Bern, ~1964) - Telefonica "Hilo Musical" wired-music receiver.
# 7 momentary piano keys (1-6 + PU) and 2 pots (volume, tone).
# The tone pot carries the original mains switch on its CCW end-stop.
#
# Panel on the Hasler HAT: keys to its MCP23017, wipers to its ADS1115, lamp
# to three Pi GPIOs. The cabinet's 16-wire ribbon is crimped into a 26-way
# IDC plug flush to pin 1, so wire n lands on J2 pin n (17-26 empty).
#
# Use this only once the HAT is fitted: `variant: hasler-hm-hat` in
# /etc/hasler/box.yaml (or `haslerd --variant hasler-hm-hat` on a box without
# box.yaml). Until then hasler-hm.yaml (the prototype stripboard's mapping) stays
# live; this file on the stripboard would read the keys on the wrong pins and the
# end switch as off (standby at boot; no shutdown, since it never reads on).
# The descriptor's name stays hasler-hm (same cabinet), so the box's calibration
# overlay /etc/hasler/variant.d/hasler-hm.yaml applies to both.
# Calibration below is the stripboard's (hasler-hm.yaml, 19 Oct): the same pots
# on the same ADS channels, 3V3A instead of the Pi's 3.3 V - re-check on the HAT.
variant: hasler-hm

io:
  digital:
    backend: mcp23017
    # Pinned, not auto: the HAT's CH224A answers at 0x22/0x23 if JP9/JP10 are
    # closed, and auto refuses two devices. A0-A2 to GND (JP2-JP4). Check:
    # i2cdetect -y 1
    addr: 0x20
    int_gpio: 23         # INTA (JP5). Accepted, not used yet - the panel polls.
    # Logical names ARE the chip pins: d0-d6 = GPA0-6, d8-d14 = GPB0-6.
    # GPA7 (d7) and GPB7 (d15) are output-only and not routed on the HAT.
  # Fallback - no HAT, keys straight to Pi GPIO. Uncomment this and remove
  # the block above. Indexed by dN: d0 is the end-switch, d1-d7 are
  # placeholders (0, never opened), d8-d14 the keys. Avoids the Amp4 Pro's
  # 2,3,4, 18-21, its EEPROM (0,1), UART (14,15), the lamp (17,22,27) and the
  # HAT's INT/RDY/RST (23,24,25). 9/10 are SPI - leave SPI off.
  # digital:
  #   backend: gpio
  #   pins: [5, 0, 0, 0, 0, 0, 0, 0, 6, 12, 13, 16, 26, 9, 10]
  analog:
    backend: ads1115     # on the HAT, ADDR to GND (JP8)
    addr: 0x48
  # Pilot lamp: the cabinet's 4-leg RGB LED. Its resistors sit on the HAT
  # (220/100/100 ohm); the common anode is J2-12 (3V3A).
  # docs/lamp.md. pwm-sysfs = the kernel pwm-gpio overlays on 17/22/27
  # (config.txt), hrtimer PWM at 800 Hz; `backend: gpio` (software PWM) is the
  # fallback, used anyway with a warning if the overlays are missing.
  lamp:
    backend: pwm-sysfs
    pins: {red: 17, green: 22, blue: 27}   # J2-13, J2-15, J2-16 - Pi header 11, 15, 13
    common: anode        # metered 2026-10-12: red probe on the long leg lights it
    frequency_hz: 800

controls:
  # J2: 2x13 keyed header, standard IDC numbering (pin 1 by the key slot).
  # Keys and the tone switch close to GND on J2-2.
  - {id: k1, kind: momentary, pin: d8}    # J2-1 (GPB0)
  - {id: k2, kind: momentary, pin: d9}    # J2-3
  - {id: k3, kind: momentary, pin: d10}   # J2-4
  - {id: k4, kind: momentary, pin: d11}   # J2-5
  # k5/k6 hold = volume down/up, ramping every repeat_ms until released.
  # Tap still plays the preset.
  - {id: k5, kind: momentary, pin: d12, repeat_ms: 150}   # J2-6
  - {id: k6, kind: momentary, pin: d13, repeat_ms: 150}   # J2-7
  - {id: pu, kind: momentary, pin: d14}   # J2-8 (GPB6)

  - id: volume
    kind: pot
    channel: 1   # volume wiper, J2-10 -> A1
    # Measured on the stripboard 19 Oct after the pot rework (hasler-hm.yaml has
    # the story): the curve undoes the pot's S-shaped taper so knob angle ->
    # 0-100 evenly, and runs backwards because the pot reads low at the right
    # end (clockwise is louder).
    hysteresis_counts: 30
    curve: [[25, 100], [1879, 87.5], [10882, 75], [21106, 62.5], [23783, 50], [24850, 37.5], [25616, 25], [25960, 12.5], [26150, 0]]

  - id: tone
    kind: pot
    channel: 0   # tone wiper, J2-9 -> A0
    taper: linear   # 2026-10-13 sweep: even, 0 .. ~25500
    # TODO(phase-0): first value is the ADC count AT THE DETENT. The switch
    # eats the bottom of the sweep, so the usable range starts above it.
    range: [0, 25500]
    # Tilt: left warmer, right brighter, pivoting at 800 Hz (hasler-hm.yaml).
    effect: tilt
    effect_params: {range_db: 6, pivot: 800}
    end_switch:
      id: power
      pin: d0              # J2-14 (GPA0)
      off_hold_ms: 5000    # held off this long -> clean shutdown

# Actions bind to control ids. Nothing here knows a GPIO number.
actions:
  k1.tap: {do: preset, n: 1}
  k2.tap: {do: preset, n: 2}
  k3.tap: {do: preset, n: 3}
  k4.tap: {do: preset, n: 4}
  k5.tap: {do: preset, n: 5}
  k6.tap: {do: preset, n: 6}
  # k1-k4 hold: nothing by default. Home Assistant actions belong to the home
  # the radio lives in - connect HA on the key page and pick its scenes there.
  # ~2 knob units (~1.8 dB) per step: bottom to volume_limit in ~8 s of holding.
  k5.hold: {do: volume_step, delta: -2}
  k6.hold: {do: volume_step, delta: 2}
  pu.tap: {do: cycle_source}
  pu.hold: {do: bt_pair, seconds: 120}
  power.on: {do: resume}
  power.off: {do: standby}
  power.off_held: {do: shutdown}
  volume.change: {do: set_volume}
  tone.change: {do: set_tone}

# One key, one source. Each preset names exactly one of:
#   radio:    an HTTP stream URL, played by MPD
#   spotify:  a spotify:playlist:/album:/track: URI, played by go-librespot
#   ytm:      a YouTube Music playlist (or watch) URL, queued into MPD
# Optional `shuffle: true` (spotify/ytm). The pre-sources `url:` still works
# and means `radio:`.
#
# Tapping the key that is already playing: radio -> standby, spotify/ytm ->
# next track.
#
# Bench test set - one of each source, all known to play. Swap in your own.
presets:
  - {n: 1, name: "Radio Swiss Classic", radio: "http://stream.srg-ssr.ch/m/rsc_de/mp3_128"}
  - {n: 2, name: "Radio Swiss Jazz", radio: "http://stream.srg-ssr.ch/m/rsj/mp3_128"}
  # RNE Radio 3 (Spain). HLS - MPD plays it; not in moOde's station list.
  - {n: 3, name: "RNE Radio 3", radio: "https://rtvelivestream.rtve.es/rtvesec/rne/rne_r3_main.m3u8"}
  - {n: 4, name: "Today's Top Hits", spotify: "spotify:playlist:37i9dQZF1DXcBWIGoYBM5M", shuffle: true}
  - {n: 5, name: "Famous classical", ytm: "https://music.youtube.com/playlist?list=PL68AC80CBF3649BBB"}
  - {n: 6, name: "Classical shuffle", ytm: "https://music.youtube.com/playlist?list=PL68AC80CBF3649BBB", shuffle: true}
