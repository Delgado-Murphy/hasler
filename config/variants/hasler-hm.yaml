# Hasler HM (Bern, ~1964) - Telefonica "Hilo Musical" wired-music receiver.
# 7 momentary piano keys (1-6 + PU) and 2 pots (volume, tone).
# The tone pot carries the original mains switch on its CCW end-stop.
#
# Keys go through an MCP23017 expander on I2C, so the panel loom is 4 wires
# (3V3, GND, SDA, SCL). No ADC fitted yet - the wheels are dead and volume
# comes from the moOde UI / HA until the ADS1115 lands.
variant: hasler-hm

io:
  digital:
    backend: mcp23017
    # auto = probe 0x20-0x27 and use the one board that answers: the CQRobot
    # board (A0-A2 open, 0x27) and the green breakout (A0-A2 to GND, 0x20) both
    # work with no edit. A number pins it. Check: i2cdetect -y 1
    addr: auto
    # Logical names ARE the wiring: d0-d6 = PA0-PA6, d8 = PB0. Wire by the
    # silkscreen. PA7 (d7) and PB7 (d15) are output-only - never use them.
  # Fallback - keys straight to Pi GPIO, no expander. Uncomment this and
  # remove the block above. The list is d0..d8 in order; d7 is a placeholder
  # so the end-switch on d8 lands on GPIO 25. Avoids the Amp4 Pro's 2,3,4,
  # 18-21, the HAT EEPROM (0,1), UART (14,15) and the lamp (17,22,27).
  # digital:
  #   backend: gpio
  #   pins: [5, 6, 12, 13, 16, 23, 24, 26, 25]
  analog:
    backend: none        # -> {backend: ads1115, addr: 0x48} in Phase 3b
  # Pilot lamp: the 4-leg RGB LED, its resistors on the prototype board
  # (Paper PB1-PB3). The board's 7-wire ribbon sits on the Pi header's odd
  # row only - pins 1 3V3, 3 SDA, 5 SCL, (7 empty: amp mute), 9 GND, 11/13/15
  # = lamp R/G/B - so nothing ever lands on the 5 V row. The LED
  # common goes to 3.3 V: IDC wire 11 (common anode, metered).
  lamp:
    backend: gpio
    pins: {red: 17, green: 22, blue: 27}   # header pins 11, 15, 13 - cabinet wires 13, 15, 16
    common: anode        # metered 2026-10-12: red probe on the long leg lights it

controls:
  # Prototype stripboard (Paper PB3): each key sits on the MCP pin its J2
  # wire lands on. The cabinet's female IDC lands wire 1 on 13·19, so the
  # cabinet is wired to suit: 1 K1, 2 GND, 3-8 K2..PU, 14 tone switch.
  - {id: k1, kind: momentary, pin: d4}   # cabinet wire 1 (white) - J2 as the female IDC really lands
  - {id: k2, kind: momentary, pin: d3}   # wire 3
  - {id: k3, kind: momentary, pin: d5}   # wire 4
  - {id: k4, kind: momentary, pin: d2}   # wire 5
  # k5/k6 hold = volume down/up, ramping every repeat_ms until released.
  # Tap still plays the preset. Stand-in for the dead wheels until the ADS1115.
  - {id: k5, kind: momentary, pin: d6, repeat_ms: 150}
  - {id: k6, kind: momentary, pin: d1, repeat_ms: 150}
  - {id: pu, kind: momentary, pin: d0}

  - id: volume
    kind: pot
    channel: 1   # volume wiper, cabinet wire 10 -> A1
    taper: log
    # TODO(phase-0): replace `taper`+`range` with measured `curve` points.
    range: [0, 26400]

  - id: tone
    kind: pot
    channel: 0   # tone wiper, cabinet wire 9 -> A0
    taper: log
    # TODO(phase-0): first value is the ADC count AT THE DETENT. The switch
    # eats the bottom of the sweep, so the usable range starts above it.
    range: [0, 26400]
    end_switch:
      id: power
      pin: d8              # PB0 - not d7/PA7, which cannot be an input
      off_hold_ms: 5000    # held off this long -> clean shutdown

# Actions bind to control ids. Nothing here knows a GPIO number.
actions:
  k1.tap: {do: preset, n: 1}
  k2.tap: {do: preset, n: 2}
  k3.tap: {do: preset, n: 3}
  k4.tap: {do: preset, n: 4}
  k5.tap: {do: preset, n: 5}
  k6.tap: {do: preset, n: 6}
  # k1-k4 hold: nothing by default. Home Assistant actions belong to the home
  # the radio lives in - connect HA on the key page and pick its scenes there.
  # ~2 knob units (~1.8 dB) per step: bottom to volume_limit in ~8 s of holding.
  k5.hold: {do: volume_step, delta: -2}
  k6.hold: {do: volume_step, delta: 2}
  pu.tap: {do: cycle_source}
  pu.hold: {do: bt_pair, seconds: 120}
  power.on: {do: resume}
  power.off: {do: standby}
  power.off_held: {do: shutdown}
  volume.change: {do: set_volume}
  tone.change: {do: set_tone}

# One key, one source. Each preset names exactly one of:
#   radio:    an HTTP stream URL, played by MPD
#   spotify:  a spotify:playlist:/album:/track: URI, played by go-librespot
#   ytm:      a YouTube Music playlist (or watch) URL, queued into MPD
# Optional `shuffle: true` (spotify/ytm). The pre-sources `url:` still works
# and means `radio:`.
#
# Tapping the key that is already playing: radio -> standby, spotify/ytm ->
# next track.
#
# Bench test set - one of each source, all known to play. Swap in your own.
presets:
  - {n: 1, name: "Radio Swiss Classic", radio: "http://stream.srg-ssr.ch/m/rsc_de/mp3_128"}
  - {n: 2, name: "Radio Swiss Jazz", radio: "http://stream.srg-ssr.ch/m/rsj/mp3_128"}
  # RNE Radio 3 (Spain). HLS - MPD plays it; not in moOde's station list.
  - {n: 3, name: "RNE Radio 3", radio: "https://rtvelivestream.rtve.es/rtvesec/rne/rne_r3_main.m3u8"}
  - {n: 4, name: "Today's Top Hits", spotify: "spotify:playlist:37i9dQZF1DXcBWIGoYBM5M", shuffle: true}
  - {n: 5, name: "Famous classical", ytm: "https://music.youtube.com/playlist?list=PL68AC80CBF3649BBB"}
  - {n: 6, name: "Classical shuffle", ytm: "https://music.youtube.com/playlist?list=PL68AC80CBF3649BBB", shuffle: true}
