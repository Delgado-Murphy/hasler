# Snapcast server for a Hasler multiroom group - started by
# snapserver-hasler.service only while this radio leads (hasler-multiroom).
# Shipped in every release as app/config/snapcast/snapserver.conf.

[server]
threads = -1
datadir = /var/lib/snapserver-hasler

[http]
# No web UI (snapweb) and no HTTP/websocket control.
enabled = false

[tcp]
# JSON-RPC control on this radio only: nobody on the network may change
# volumes, mutes or groups. (The knob is local anyway: clients run --mixer none.)
enabled = true
bind_to_address = 127.0.0.1
port = 1705

[stream]
port = 1704
# Every local player plays into _audioout = plughw:Loopback,0,0 at this
# format while leading (hasler-multiroom); this is the other end.
source = alsa:///?name=Hasler&device=hw:Loopback,1,0&send_silence=false&idle_threshold=100
sampleformat = 44100:16:2
codec = flac
chunk_ms = 26
# End-to-end latency, capture to every speaker (this radio's own too) [ms].
buffer = 1000
send_to_muted = false

[streaming_client]
initial_volume = 100

[logging]
sink = system
filter = *:info
