# Hasler: phones show the radio as a loudspeaker (Audio/Video major 4, minor
# 0x14), not "portable audio" - moOde's /etc/bluetooth/main.conf says
# Class=0x2c041c. Set once bluetoothd has the adapter; "-" = never fail the unit.
[Service]
ExecStartPost=-/bin/sh -c 'sleep 2; /usr/bin/btmgmt --index 0 class 4 20 >/dev/null'
