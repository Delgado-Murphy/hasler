# Hasler: 1 s of Bluetooth buffer instead of moOde's 500 ms.
#
# moOde's bluealsa-aplay@.service (started by its udev a2dp-autoconnect when a
# phone connects) plays the phone into _audioout, i.e. through the CamillaDSP
# ALSA plugin for the tone knob. bluealsa-aplay only starts the output once
# its buffer is full and refills it to the brim after every underrun, so the
# buffer time is the cushion the stream starts with. For the first ~20 s after
# a phone connects (AVRCP/SDP setup on the shared radio), an Android phone's
# A2DP stream stalls for up to ~0.9 s and then catches up in a burst; with
# 500 ms that was 4 underruns + 8 CamillaDSP re-prepares in 18 s (2026-10-21,
# Pixel 11 Pro XL, aptX HD), after which it played clean. 1 s rides through
# those stalls. Cost: Bluetooth audio runs ~0.5 s further behind the phone
# (music: unnoticed; video: the phone's own lip-sync slack).
#
# Same command as moOde's unit, AUDIODEV still from moOde's
# /etc/bluealsaaplay.conf; only BUFFERTIME (moOde's "PCM buffer" setting,
# 500 ms at most there) is replaced. Takes effect at the next phone connect.
[Service]
ExecStart=
ExecStart=/usr/bin/bluealsa-aplay --profile-a2dp --pcm-buffer-time=1000000 -D $AUDIODEV
