# Hasler: a restart may not hang on moOde's background programs.
#
# rc-local starts moOde's worker, and the worker starts AirPlay
# (shairport-sync and its metadata reader), the mount monitor and its
# watchdog - all in this unit's cgroup. Debian's unit has TimeoutSec=infinity,
# so one of them ignoring SIGTERM held a reboot until reboot.target's own
# 30 min timeout (bench, 2026-11-21 and -22: two update restarts sat at a
# steady lamp, "reboot.target: Job reboot.target/start timed out"). With a stop
# timeout, systemd sends SIGKILL after 20 s instead. Starting stays unlimited.
[Service]
TimeoutStopSec=20s
