# Hasler: systemd restarts an MPD that has stopped answering.
#
# 2026-10-25, MPD 0.24.15 (moOde 10.3.6): a radio preset on an HLS stream
# (.m3u8), then a YouTube Music preset - MPD's ffmpeg decoder sat in
# libavformat's HLS retry loop, the player and main threads waited on it for
# good. The process lived, port 6600 stayed open and answered nobody; only a
# restart helped (upstream fix: MPD 0.25 "interrupt blocking libavformat I/O
# on STOP"). MPD sends WATCHDOG=1 from its main loop (sd_watchdog_enabled), so
# a stuck main loop misses it and systemd kills it, then starts it again.
#
# TimeoutStopSec: a hung MPD ignores SIGTERM (systemd's default waits 90 s,
# moOde's unit 20 s); a healthy one stops in 0.5-4 s (its output closing
# through CamillaDSP, bench 2026-10-21), so 10 s is room for that and no more.
# Restart=on-failure: a watchdog kill or a crash, never a `systemctl stop`
# (moOde's own restarts are untouched). Takes effect at MPD's next start.
# haslerd's own restart (player/watchdog.py MpdRecovery, 30 s) is the fallback.
[Service]
WatchdogSec=20
TimeoutStopSec=10
Restart=on-failure
RestartSec=1
