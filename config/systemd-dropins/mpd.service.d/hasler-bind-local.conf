# Hasler: MPD and CamillaDSP answer this radio only (scripts/hasler-local-only).
#
# moOde writes /etc/mpd.conf with bind_to_address "any" whenever its MPD
# settings are saved, and its ALSA plugin starts CamillaDSP with -a 0.0.0.0:
# both without a password, so anyone on the Wi-Fi could turn the volume past
# haslerd's ceiling (2026-11-14). Before every MPD start the helper puts
# 127.0.0.1 back in both; MPD reads its config only at start.
# '-': a failure here never keeps MPD from starting. '+': as root without the
# unit's ProtectSystem= (the helper touches alsa.conf's time so players reload).
# Named to sort before hasler-early.conf, so it runs while the amp's card is
# still being waited for, not after.
[Service]
ExecStartPre=-+/usr/local/sbin/hasler-local-only apply
