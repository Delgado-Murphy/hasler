# Hasler: Debian's own bluealsa-aplay.service must never run beside moOde's.
#
# moOde plays Bluetooth with its bluealsa-aplay@.service (into _audioout and
# CamillaDSP). The Debian unit (bluez-alsa-utils, disabled) plays into
# "default"; started by hand on 2026-10-21 it grabbed the phone's stream
# first (moOde's then failed with "Device or resource busy") and retried a
# failing "default" every second - the phone was not heard. With this, starting
# it is a no-op ("condition failed") wherever moOde's template unit exists.
[Unit]
ConditionPathExists=!/etc/systemd/system/bluealsa-aplay@.service
