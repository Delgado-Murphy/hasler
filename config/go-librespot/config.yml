# go-librespot - Spotify Connect device for haslerd to drive over its local API.
# Installed to ~/.config/go-librespot/config.yml by scripts/install.sh.
# Keys checked against config_schema.json at go-librespot v0.10.3.
#
# Credentials and player state live next to this file in state.json, written
# after the one-time login (older releases used credentials.json). Sign in and
# out from the key page. Logged in: curl 127.0.0.1:3678/status gives JSON;
# 204 = not yet; curl 127.0.0.1:3678/auth/code = the pairing code it waits on.

device_name: Hasler
device_type: speaker
log_level: info

# The Amp4 Pro, by card id so an HDMI card appearing cannot renumber it.
# install.sh rewrites the CARD= part from /proc/asound/cards.
# moOde's "_audioout" device - the one MPD, Bluetooth and AirPlay play into -
# so Spotify gets the same treatment: the mono downmix when it is on (key page
# -> Settings -> Mono; scripts/hasler-audio-mono), and whatever output moOde is
# set to. It ends in plughw, so ALSA converts rate/format instead of refusing.
# The card is exclusive - only one of MPD and go-librespot can hold it, which is
# why moOde's own Spotify renderer must be OFF and haslerd stops one before
# starting the other.
audio_backend: alsa
audio_device: _audioout

# Volume belongs to the knob and the hardware mixer, where haslerd enforces
# volume_limit. external_volume = never scale samples, never touch the mixer.
# Do not set mixer_device: a Spotify app could then push the mixer past the
# speaker's limit.
external_volume: true
mixer_device: ''
# Full-scale samples always; the hardware mixer does the attenuating.
initial_volume: 100
ignore_last_volume: true

bitrate: 320

# Signing in: with no account in state.json, go-librespot asks Spotify for a
# pairing code and the key page shows it (Settings -> Phones & casting ->
# Spotify: "go to spotify.com/pair and enter ..."); the account then persists in
# state.json. haslerd switches this type (web/spotify_account_api.py): zeroconf
# when signed out, device_auth to sign in. Guests' zeroconf logins are never
# stored (persist_credentials stays off). The interactive callback_port is
# kept for the SSH-tunnel login in docs/build-guide.md, Phase 3c.
zeroconf_enabled: true   # owner: guests on the Wi-Fi see "Hasler" in Spotify too
credentials:
  type: device_auth
  interactive:
    callback_port: 36842

# Local API for haslerd. Loopback only - it has no authentication.
server:
  enabled: true
  address: 127.0.0.1
  port: 3678
  allow_origin: ''
