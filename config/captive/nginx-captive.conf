# Installed as /etc/nginx/sites-enabled/hasler-captive.conf by scripts/bootstrap.sh.
#
# The captive portal for moOde's setup hotspot. In hotspot mode the hotspot's
# DNS answers every name with the Pi (dnsmasq-hotspot.conf), so a phone's "is
# there internet?" check - and any http:// page at all - arrives here. Answering
# with a redirect instead of the expected reply is what makes the phone open its
# "sign in to network" sheet, straight onto haslerd's Wi-Fi page (port 8080).
#
# On the home network none of this is reached: the names below resolve to the
# real servers, and the hotspot addresses are not the Pi's. moOde's own site
# (moode-http.conf, the default_server) is untouched.
#
# HTTPS checks (Android also probes https://www.google.com/generate_204) find
# nothing on port 443 and fail at once, which the phones read as "behind a
# portal" together with the redirected http:// check. A certificate can't be
# faked, so this is as far as any captive portal gets.

# Names that mean "the radio itself" on the hotspot: those keep moOde's pages
# (anything but "/", e.g. http://172.24.1.1/net-config.php, moOde's own
# Network page - the way to set the Wi-Fi if haslerd ever doesn't answer).
map $host $hasler_captive_own {
	default        0;
	172.24.1.1     1;
	10.42.0.1      1;
	hasler         1;
	hasler.local   1;
	moode          1;
	moode.local    1;
}

# The checks' paths, whatever name they come with.
map $uri $hasler_captive_probe {
	default                       0;
	/generate_204                 1;   # Android, ChromeOS, Chrome
	/gen_204                      1;
	/hotspot-detect.html          1;   # Apple
	/library/test/success.html    1;
	/connecttest.txt              1;   # Windows 10/11
	/redirect                     1;
	/ncsi.txt                     1;   # older Windows
	/success.txt                  1;   # Firefox
	/canonical.html               1;
	/check_network_status.txt     1;   # GNOME / NetworkManager
	/nm                           1;
	/kindle-wifi/wifistub.html    1;
}

# 1. The checks by name, on whichever address they arrive.
server {
	listen 80;
	listen [::]:80;
	server_name
		connectivitycheck.gstatic.com connectivitycheck.android.com
		clients1.google.com clients3.google.com clients4.google.com www.google.com
		play.googleapis.com www.gstatic.com connectivitycheck.platform.hicloud.com
		connectivity.samsung.com.cn captive.apple.com www.apple.com
		www.appleiphonecell.com www.itools.info www.ibook.info www.airport.us
		www.thinkdifferent.us www.msftconnecttest.com www.msftncsi.com
		ipv6.msftconnecttest.com detectportal.firefox.com nmcheck.gnome.org
		network-test.debian.org connectivity-check.ubuntu.com
		spectrum.s3.amazonaws.com neverssl.com
		wifi wifi.hasler setup.hasler;
	location / {
		return 302 http://$server_addr:8080/wifi;
	}
}

# 2. Everything that arrives at the hotspot's address, whatever the name: this
# is the default for those addresses only. nginx binds *:80 once (moOde's
# listen) and tells the address of each connection apart, so these listens
# work even while the address does not exist (the radio is on the home Wi-Fi).
# 10.42.0.1 is where NetworkManager puts a hotspot whose profile lost its
# address (scripts/hasler-wifi-join before 2026-10-21).
server {
	listen 172.24.1.1:80 default_server;
	listen 10.42.0.1:80 default_server;
	server_name _;
	root /var/www;
	index index.html index.htm;

	if ($hasler_captive_own = 0) {
		return 302 http://$server_addr:8080/wifi;
	}
	if ($hasler_captive_probe) {
		return 302 http://$server_addr:8080/wifi;
	}
	if ($request_uri = "/") {
		return 302 http://$server_addr:8080/wifi;
	}
	include moode-locations.conf;
}
