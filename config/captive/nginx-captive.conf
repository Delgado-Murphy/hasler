# Installed as /etc/nginx/sites-enabled/hasler-captive.conf by scripts/install.sh.
#
# The phones' "is there internet?" checks. In hotspot mode DNS sends these to
# the Pi (see dnsmasq-hotspot.conf); answering with a redirect instead of the
# expected reply is what makes the phone open its "sign in to network" sheet,
# straight onto the Wi-Fi setup page. On the home network these names resolve
# to the real servers, so this block is never reached. moOde's own site (the
# default_server) is untouched.
server {
	listen 80;
	listen [::]:80;
	server_name
		connectivitycheck.gstatic.com connectivitycheck.android.com
		clients1.google.com clients3.google.com www.google.com play.googleapis.com
		captive.apple.com www.apple.com www.appleiphonecell.com www.itools.info
		www.ibook.info www.airport.us www.thinkdifferent.us
		www.msftconnecttest.com www.msftncsi.com ipv6.msftconnecttest.com
		detectportal.firefox.com nmcheck.gnome.org network-test.debian.org
		connectivity-check.ubuntu.com neverssl.com
		wifi wifi.hasler setup.hasler;
	location / {
		return 302 http://172.24.1.1:8080/wifi;
	}
}
