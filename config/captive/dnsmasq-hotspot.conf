# Installed as /etc/NetworkManager/dnsmasq-shared.d/hasler-captive.conf by
# scripts/bootstrap.sh. NetworkManager's dnsmasq reads this only for "shared"
# connections - i.e. moOde's fallback hotspot - never for normal Wi-Fi.
#
# Every name resolves to the Pi, so a phone joining "Hasler" finds its
# connectivity check answered by us (nginx-captive.conf) and pops up the Wi-Fi
# setup page itself. 172.24.1.1 is moOde's hotspot address (cfg_system
# ap_network_addr); scripts/bootstrap.sh repairs a hotspot profile that lost it.
address=/#/172.24.1.1
