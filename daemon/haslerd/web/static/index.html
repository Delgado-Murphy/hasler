*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--cream);font:15px/1.4 var(--sans);min-height:100vh;min-height:100dvh;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;font-size:10px;line-height:14px;color:var(--muted)}

/* ---------- shell ---------- */
.app{max-width:440px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
.app[data-view="remote"] #panel{display:none}
.app:not([data-view="remote"]) #remote{display:none}
@media (min-width:960px){
  .app{max-width:1220px;display:grid;grid-template-columns:420px minmax(0,1fr);gap:48px;align-items:start;padding-top:24px}
  .app #remote,.app[data-view="remote"] #panel{display:flex}
  .app:not([data-view="remote"]) #remote{display:flex}
  #remote{position:sticky;top:24px}
  #panel{min-height:calc(100vh - 48px)}
  .panel-remote-only{display:none !important}
}
.remote{display:flex;flex-direction:column;gap:18px}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0;min-height:calc(100vh - 34px);min-height:calc(100dvh - 34px - env(safe-area-inset-top))}
.panel > .sheet{flex:1 0 auto}

/* ---------- top bars ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.brand{margin:0;color:var(--brass);font:italic 600 22px/26px var(--serif);letter-spacing:.01em}
.top-btns{display:flex;align-items:center;gap:2px}
.round{position:relative;width:44px;height:44px;border:0;background:none;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;color:var(--brass)}
.round::before{content:"";position:absolute;inset:4px;border:1px solid var(--line);border-radius:50%;transition:border-color .15s,background .15s}
.round:hover::before{border-color:var(--line2);background:rgba(201,161,90,.06)}
.round svg{position:relative;display:block}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 6px;border:0;background:none;color:var(--brass);font:600 13px/1 var(--sans);position:relative}
.pill::before{content:"";position:absolute;inset:4px 0;border:1px solid var(--line);border-radius:18px;transition:border-color .15s}
.pill:hover::before{border-color:var(--line2)}
.pill > *{position:relative}
.pill{padding:0 14px 0 12px}
.title-row{display:flex;align-items:center;gap:6px;min-height:44px}
.title-row h1,.title-row h2.brand{margin:0}
.btn-done{min-height:44px;padding:12px 18px;border:0;border-radius:22px;background:var(--amber);color:#1A1208;font:800 14px/18px var(--sans)}
.btn-done:hover{filter:brightness(1.06)}

/* ---------- dial (13d) ---------- */
.bezel{padding:6px;border-radius:16px;background:linear-gradient(180deg,#D8D2C6 0%,#8E877B 50%,#C9C2B5 100%);box-shadow:0 2px 0 #000,0 8px 18px rgba(0,0,0,.5)}
.glass{position:relative;display:flex;flex-direction:column;gap:12px;padding:16px 18px 12px;border-radius:11px;min-width:0;
  background:radial-gradient(circle farthest-corner at 50% 35%,#FBF0D4 0%,#EFDAA8 62%,#D6BA7E 100%);transition:filter .6s ease}
.glass.off{filter:brightness(.72) saturate(.55)}
.glass.offline{filter:brightness(.6) saturate(.3)}
.dial-head{display:flex;justify-content:space-between;gap:10px;color:#6E5330;font:9.5px/13px var(--mono);letter-spacing:.18em;text-transform:uppercase}
.dial-head span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dial-head span:last-child{flex:none}
.dial-name{margin:0;color:#1E1308;font:600 34px/38px var(--serif);letter-spacing:-.01em;overflow-wrap:break-word;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.dial-name.long{font-size:25px;line-height:29px}
.song{display:flex;align-items:center;gap:10px;min-width:0;min-height:34px}
.cover{position:relative;flex:none;width:34px;height:34px;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px rgba(60,40,20,.25);
  background:linear-gradient(135deg,#9C4A2E 0%,#C8643C 55%,#E3B98A 100%)}
.cover.radio{background:linear-gradient(160deg,#F6EBD0,#DCC594);display:flex;align-items:center;justify-content:center}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.song-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.song-title{color:#2E1F10;font:600 14px/18px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-sub{color:#6E5330;font:12px/16px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scale{position:relative;height:50px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%)}
.strip{position:absolute;top:0;left:0;height:50px;will-change:transform;transition:transform .42s cubic-bezier(.3,.7,.3,1);
  background:linear-gradient(rgba(59,42,24,.7),rgba(59,42,24,.7)) 0 12px/100% 1px no-repeat,
    repeating-linear-gradient(90deg,rgba(59,42,24,.7) 0 1px,transparent 1px var(--minor,27.5px)) 0 8px/100% 8px no-repeat}
.strip.still{transition:none}
.st{position:absolute;top:0;width:var(--sp,110px);margin-left:calc(var(--sp,110px) / -2);text-align:center}
.st::before{content:"";position:absolute;left:calc(50% - .5px);top:5px;width:1px;height:14px;background:rgba(59,42,24,.7)}
.st-n{position:absolute;top:21px;left:0;right:0;font:8.5px/10px var(--mono);color:#7A5E38}
.st-nm{position:absolute;top:34px;left:6px;right:6px;font:11.5px/14px var(--serif);color:#5A4428;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.on .st-n{font-weight:700;color:#2E1F10}
.st.on .st-nm{font-weight:700;font-size:12.5px;color:#1E1308}
.needle{position:absolute;left:calc(50% - 1.5px);top:0;width:3px;height:21px;border-radius:1.5px;background:var(--needle);box-shadow:0 0 0 .5px rgba(120,30,10,.2)}
.dial-wrap{position:relative}

/* ---------- key bank ---------- */
.bank{display:flex;gap:6px;padding:10px 10px 17px;border-radius:14px;border-top:3px solid #8C6A3A;
  background:linear-gradient(180deg,#25190F 0%,#1D140C 100%);box-shadow:inset 0 2px 0 rgba(0,0,0,.5)}
.key{position:relative;flex:1 1 0;min-width:0;height:176px;padding:14px 2px 12px;border:0;border-radius:6px 6px 9px 9px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;color:var(--ink);text-align:center;
  background:linear-gradient(180deg,#F3EAD5 0%,#E2D5B8 82%,#C9B994 100%);
  box-shadow:0 5px 0 #8F7F5E,0 6px 10px rgba(0,0,0,.5);
  transition:transform .07s ease,box-shadow .1s ease,background .1s ease;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.key-n{font:900 24px/26px var(--sans);letter-spacing:-.02em}
.key-l{color:#6B5A40;font:9px/11px var(--mono);letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;max-width:100%}
.key.pu{flex-grow:1.15;margin-left:6px;color:var(--cream);background:linear-gradient(180deg,#4B3827 0%,#35271B 85%,#2A1E14 100%);box-shadow:0 5px 0 #1C130C,0 6px 10px rgba(0,0,0,.5)}
.key.pu .key-n{font-size:20px}
.key.pu .key-l{color:var(--brass)}
.key.down{transform:translateY(5px);background:linear-gradient(180deg,#FAF2DF 0%,#E8DCC0 82%,#D0C19E 100%);
  box-shadow:inset 0 3px 0 var(--amber),0 0 0 #8F7F5E,0 0 18px rgba(255,178,56,.55)}
.key.pu.down{background:linear-gradient(180deg,#5A4430 0%,#40301F 85%,#33261A 100%);box-shadow:inset 0 3px 0 var(--amber),0 0 0 #1C130C,0 0 18px rgba(255,178,56,.45)}
.key:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
@media (max-width:379px){ .key{height:164px} .key-l{font-size:8px;line-height:10px;letter-spacing:.02em} .key-n{font-size:21px} .bank{gap:5px;padding-inline:8px} }

/* ---------- controls ---------- */
.controls{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 0}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px}
.ctl-btn{width:54px;height:54px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle farthest-corner at 50% 35%,#2E2117 0%,#1F150E 100%);color:var(--brass);transition:box-shadow .2s,border-color .2s}
.ctl-btn:hover{border-color:#7A5A36}
.ctl-btn:active{transform:translateY(1px)}
.ctl-btn:disabled{opacity:.38;cursor:default;transform:none}
.ctl-btn:disabled + .ctl-lbl{opacity:.5}
.ctl-btn[aria-pressed="true"]{border-color:var(--amber);box-shadow:0 0 14px rgba(255,178,56,.35)}
.ctl-lbl{color:var(--muted);font:9.5px/12px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.knob{display:block;touch-action:none;cursor:grab;border-radius:50%}
.knob:active{cursor:grabbing}
.knob:focus-visible{outline:2px solid var(--amber);outline-offset:-6px}
.vol-lbl{color:var(--brass);font:9.5px/12px var(--mono);letter-spacing:.14em;font-variant-numeric:tabular-nums}
.tone{display:flex;align-items:center;gap:10px;margin:14px 14px 0;color:var(--muted);font:9.5px/12px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.tone[hidden]{display:none}
.tone-bar{position:relative;flex:1;height:4px;border-radius:2px;background:linear-gradient(90deg,#6B4A2A,#3A2A1C 50%,#E8CA8A)}
.tone-mid{position:absolute;left:50%;top:-3px;width:1px;height:10px;background:#5A4128}
.tone-dot{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#F0D59A,#9A7638);box-shadow:0 0 6px rgba(255,178,56,.35);transition:left .25s}
.tone-db{min-width:5.5em;text-align:right;color:var(--brass);font-variant-numeric:tabular-nums}
.tone-off{color:var(--red-text)}
.remote.offline .controls,.remote.offline .tone,.remote.offline .bank{opacity:.55;filter:saturate(.5);transition:opacity .3s}
.foot{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:8px}
.hint-line{margin:0;color:var(--muted);font:12px/16px var(--sans);text-align:center}

/* ---------- maker's mark ---------- */
.mark{display:flex;align-items:center;justify-content:center;gap:10px;margin:0;color:#7D766B;
  font:600 10px/12px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.28em;text-transform:uppercase}
.mark::before{content:"";flex:0 0 20px;height:1px;background:#2E2218}
.mark .amp{font:italic 400 10px/12px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;letter-spacing:0;text-transform:none;color:#5A544B}

/* ---------- edit keys ---------- */
.strip-keys{display:flex;gap:5px;padding:8px;border-radius:12px;border-top:2px solid #8C6A3A;background:#1F140D}
.skey{position:relative;flex:1 1 0;min-width:0;height:58px;border:0;border-radius:5px;background:#E8DCC2;color:var(--ink);font:900 17px/22px var(--sans);
  display:flex;align-items:center;justify-content:center;transition:background .12s,box-shadow .12s}
.skey.pu{flex-grow:1.15;margin-left:5px;background:#4A3726;color:var(--cream);font-size:14px}
.skey[aria-current="true"]{background:#FFF3D9;box-shadow:0 0 0 2px var(--amber),0 0 14px rgba(255,178,56,.5)}
.skey.pu[aria-current="true"]{background:#6A5038}
.skey .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.skey .dot.dirty{background:var(--amber)}
.sheet{position:relative;display:flex;flex-direction:column;gap:16px;margin:0 -16px;padding:18px 18px 0;border-top:1px solid var(--line2);border-radius:22px 22px 0 0;
  background:linear-gradient(180deg,#261A11 0%,#1F150D 100%);min-height:60vh}
.grab{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line2);flex:none}
.sheet-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sheet-head h2{margin:0;color:var(--title);font:600 28px/32px var(--serif)}
@media (min-width:960px){
  .sheet{margin:0;border:1px solid var(--line2);border-radius:22px;min-height:0;padding-bottom:0}
}
.seg{display:flex;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--well)}
.seg button{flex:1 1 0;min-width:0;min-height:44px;padding:8px 4px;border:0;border-radius:7px;background:none;color:var(--muted);font:700 13px/16px var(--sans)}
.seg button[aria-checked="true"]{background:var(--cream);color:#1E140C;font-weight:800}
.seg button:hover:not([aria-checked="true"]){color:var(--cream)}
.seg button small{display:block;font-weight:500;font-size:11px;line-height:14px;opacity:.8}
.seg button:disabled{cursor:default}
.choice{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid rgba(255,178,56,.33);border-radius:12px;background:var(--well);min-width:0}
.choice.unset{border-style:dashed;border-color:var(--line2)}
.thumb{position:relative;flex:none;width:46px;height:46px;border-radius:6px;overflow:hidden;background:linear-gradient(135deg,#3E4A57,#AEB8C2)}
.thumb.radio,.thumb.blank{background:linear-gradient(160deg,#F3EAD5,#D5C298);display:flex;align-items:center;justify-content:center}
.thumb.blank{background:#2A1D13}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb.sm{width:40px;height:40px;border-radius:5px}
.choice-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.choice-name{color:var(--title);font:600 16px/20px var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.choice-type{color:var(--muted);font:10px/13px var(--mono);letter-spacing:.08em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.choice input{min-height:36px;padding:6px 8px}
.link{background:none;border:0;padding:10px 2px;min-height:44px;color:var(--brass);font:600 13px/16px var(--sans);text-decoration:underline 1px;text-underline-offset:3px;flex:none}
.link:hover{color:#E0BC78}
.link.quiet{color:var(--muted);font-weight:500}
.link.danger{color:var(--red-text)}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none}
.searchbox input[type]{padding-left:40px}
input[type=text],input[type=search],input[type=url],input[type=password],input[type=number],input[type=time],textarea{width:100%;min-height:46px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--well);color:var(--cream);font:15px/20px var(--sans);-webkit-appearance:none;appearance:none}
input::-webkit-search-cancel-button{-webkit-appearance:none}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:1px;border-color:transparent}
input::placeholder,textarea::placeholder{color:#857256}
textarea{min-height:120px;resize:vertical;font:13px/1.45 var(--mono)}
[aria-invalid="true"]{border-color:var(--red) !important}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;min-height:36px;padding:4px 14px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--muted);font:700 13px/1 var(--sans)}
.chip::after{content:"";position:absolute;inset:-4px 0}
.chip[aria-checked="true"]{background:var(--cream);border-color:var(--cream);color:#1E140C}
.chip:hover:not([aria-checked="true"]){border-color:var(--line2);color:var(--cream)}
.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.res{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:8px;min-width:0;cursor:pointer}
.res:hover,.res[aria-selected="true"]{background:#2A1D13}
.res.picked{box-shadow:inset 2px 0 0 var(--amber)}
.res-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.res-title{color:var(--cream);font:600 14px/18px var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-sub{color:var(--muted);font:9.5px/12px var(--mono);letter-spacing:.06em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-play{flex:none;width:44px;height:44px;border:0;background:none;padding:0;position:relative;display:flex;align-items:center;justify-content:center;color:var(--brass)}
.res-play::before{content:"";position:absolute;inset:5px;border:1px solid var(--line2);border-radius:50%}
.res-play:hover::before{border-color:var(--amber)}
.res-play svg{position:relative}
.res-play[disabled]{opacity:.5}
.stat{margin:0;color:var(--muted);font-size:13px}
.stat:empty{display:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;border-top:1px solid var(--line);min-width:0}
.row-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.row-val{color:var(--cream);font:600 15px/20px var(--sans);overflow-wrap:anywhere}
.row-val small{color:var(--muted);font-weight:400;font-size:13px}
.picker{list-style:none;margin:0;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--well);display:flex;flex-direction:column}
.picker button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 10px;border:0;border-radius:8px;background:none;text-align:left;color:var(--cream);font:600 14px/18px var(--sans)}
.picker button small{display:block;color:var(--muted);font-weight:400;font-size:12px;line-height:16px}
.picker button:hover{background:#2A1D13}
.picker button[aria-checked="true"]{background:#33241A;box-shadow:inset 2px 0 0 var(--amber)}
.picker .grp{padding:10px 10px 4px;color:var(--muted);font:10px/14px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.picker .radio-dot{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line2)}
.picker button[aria-checked="true"] .radio-dot{border-color:var(--amber);background:radial-gradient(circle,var(--amber) 0 4px,transparent 4.5px)}
.field{display:flex;flex-direction:column;gap:6px}
.field > label{color:var(--muted);font:10px/14px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.hint{margin:0;color:var(--muted);font-size:13px;line-height:18px}
.err{margin:0;color:#F07A62;font:600 13.5px/18px var(--sans)}
.err::before{content:"▲ ";font-size:9px;vertical-align:1px}
.err:empty{display:none}
.note-bad{margin:0;color:#F07A62;font:12.5px/16px var(--sans)}
.alert{padding:12px 14px;border:1px solid rgba(217,68,43,.5);background:rgba(217,68,43,.08);color:#F3C0B4;border-radius:12px;font-size:14px}
.alert ul{margin:6px 0 0;padding-left:18px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;margin:0;border-radius:999px;background:var(--well);border:1px solid var(--line2);position:relative;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch input:checked{background:#5A4128}
.switch input:checked::after{transform:translateX(18px);background:var(--amber)}
.actions{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;margin:auto -18px 0;padding:14px 18px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(31,21,13,0),#1F150D 22%)}
.btn{flex:1 1 0;min-height:48px;padding:12px 14px;border:1px solid var(--line2);border-radius:12px;background:none;color:var(--brass);font:700 15px/20px var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover:not(:disabled){border-color:#7A5A36}
.btn.primary{border:0;background:var(--amber);color:#1A1208;font-weight:800;box-shadow:0 0 18px rgba(255,178,56,.3)}
.btn.primary:hover:not(:disabled){filter:brightness(1.05)}
.btn:disabled{opacity:.55;cursor:default}
.btn.small{flex:none;min-height:44px;padding:10px 18px;border-radius:10px;font-size:14px}
.btn.inline{flex:none}
.save-msg{margin:-6px 0 0;font-size:13px;color:var(--muted);text-align:center}
.save-msg.bad{color:#F07A62;font-weight:600}
.save-msg:empty{display:none}
.keylist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.keylist button{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:8px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.keylist button:hover{background:rgba(201,161,90,.05)}
.kl-n{flex:none;width:36px;height:40px;border-radius:4px 4px 6px 6px;background:#E8DCC2;color:var(--ink);font:900 16px/40px var(--sans);text-align:center}
.kl-n.pu{background:#4A3726;color:var(--cream);font-size:13px}
.kl-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.kl-name{color:var(--cream);font:600 15px/20px var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kl-sub{color:var(--muted);font:10px/13px var(--mono);letter-spacing:.08em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{flex:none;color:var(--muted)}
/* key combinations (Edit keys) */
.combos{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.combo-h{margin:0;color:var(--title);font:600 18px/24px var(--serif)}
.combo-h:focus{outline:none}
.combo-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.combo-row{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 4px;border-bottom:1px solid var(--line)}
.combo-row:first-child{border-top:1px solid var(--line)}
.cc-keys{flex:none;display:flex;align-items:center;gap:4px}
.cc-keys .kl-n{width:28px;height:32px;font-size:14px;line-height:32px}
.cc-keys .kl-n.pu{font-size:11px}
.cc-plus{color:var(--muted);font:700 13px/16px var(--sans)}
.cc-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cc-what{color:var(--cream);font:600 15px/20px var(--serif);overflow-wrap:anywhere}
.cc-sub{color:var(--muted);font:10px/13px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.cc-sub.bad{color:#F07A62}
.cc-btns{flex:none;display:flex;gap:14px}
.combo-caps{display:flex;gap:5px;padding:6px;border-radius:10px;background:#1F140D}
.ccap{flex:1 1 0;min-width:0;height:52px;padding:0;border:0;border-radius:5px 5px 7px 7px;background:#E8DCC2;color:var(--ink);font:900 17px/22px var(--sans);transition:background .12s,box-shadow .12s}
.ccap.pu{flex-grow:1.15;margin-left:5px;background:#4A3726;color:var(--cream);font-size:14px}
.ccap[aria-pressed="true"]{background:#FFF3D9;box-shadow:0 0 0 2px var(--amber),0 0 12px rgba(255,178,56,.45)}
.ccap.pu[aria-pressed="true"]{background:#6A5038}
.ccap:disabled{opacity:.32;cursor:default}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.combo-note{padding:8px 12px;border:1px dashed var(--line2);border-radius:10px}

/* ---------- browse ---------- */
.shelf{display:flex;flex-direction:column;gap:10px;min-width:0}
.shelf-head h2{margin:0;color:var(--title);font:600 20px/24px var(--serif)}
.shelf-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.cards{display:flex;gap:12px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-padding-inline:16px;margin:0 -16px;padding:2px 16px 10px;list-style:none;scrollbar-width:thin;scrollbar-color:#2E2117 transparent}
.card{flex:0 0 136px;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.card-play{display:flex;flex-direction:column;gap:7px;padding:0;border:0;background:none;text-align:left;width:100%;border-radius:10px}
.art{position:relative;width:136px;height:136px;border-radius:10px;overflow:hidden;background:#2A1D13;box-shadow:0 0 0 1px rgba(201,161,90,.15)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art.radio{background:radial-gradient(circle farthest-corner at 50% 35%,#FBF0D4 0%,#EFDAA8 62%,#D6BA7E 100%);display:flex;align-items:center;justify-content:center}
.art .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#5A4128}
.badge{position:absolute;left:8px;top:8px;padding:2px 6px;border-radius:4px;background:rgba(23,16,11,.82);color:var(--amber);font:9px/12px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.art.radio .badge{background:#1E1308;color:#FFD48A}
.card-title{color:var(--cream);font:600 14px/18px var(--sans);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.card-sub{color:var(--muted);font-size:12px;line-height:16px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.card-add{position:absolute;right:4px;top:96px;width:44px;height:44px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.card-add span{display:flex;align-items:center;justify-content:center;gap:2px;height:28px;padding:0 9px;border-radius:14px;background:rgba(23,16,11,.88);border:1px solid var(--line2);color:var(--amber);font:700 11px/1 var(--sans);white-space:nowrap}
.card-add{right:2px;width:auto;padding:0 2px}
.card-add:hover span{border-color:var(--amber)}
.card-play:hover .art{box-shadow:0 0 0 2px var(--line2)}
.card-play:focus-visible{outline-offset:3px}
.card.more .art{background:var(--well);border:1px dashed var(--line2);box-shadow:none;display:flex;align-items:center;justify-content:center;color:var(--brass)}
.more-box{display:flex;flex-direction:column;gap:8px}
.empty{padding:28px 18px;border:1px dashed var(--line2);border-radius:14px;text-align:center;color:var(--text2)}
.empty h2{margin:0 0 6px;color:var(--title);font:600 20px/24px var(--serif)}
.loading{padding:30px 0;text-align:center;color:var(--muted)}
.skeleton{display:flex;gap:12px;overflow:hidden}
.skeleton i{flex:0 0 136px;height:136px;border-radius:10px;background:linear-gradient(90deg,#20160E,#2A1D13,#20160E);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- settings / HA ---------- */
.card-box{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--line2);border-radius:14px;background:linear-gradient(180deg,#26190F 0%,#211610 100%)}
.card-box h2,.card-box h3{margin:0;color:var(--title);font:600 20px/24px var(--serif)}
.card-box p{margin:0}
.card-box .body{color:var(--text2);font-size:14px;line-height:20px}
.card-box.warn{border-color:rgba(217,68,43,.45);background:linear-gradient(180deg,#2A1912,#22140E)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--sheet);overflow:hidden}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;min-height:72px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.li-title{color:var(--cream);font:600 15px/20px var(--sans)}
.li-sub{color:var(--muted);font-size:13px;line-height:18px;overflow-wrap:anywhere}
.li-act{flex:none;color:var(--brass);font:600 13px/16px var(--sans);background:none;border:0;min-height:44px;padding:0 4px;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.li-act:hover{color:#E0BC78}
.li.col{flex-direction:column;align-items:stretch}
.li-val{color:var(--brass);font:13px/16px var(--mono);font-variant-numeric:tabular-nums}
.pair{display:flex;gap:10px;min-width:0}
.pair > .field{flex:1 1 0;min-width:0}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.grp-sec{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.grp-sec + .grp-sec{margin-top:20px}
.grp-lbl{padding:0 4px}
h3.grp-lbl{margin:0;font-weight:400}
input[type=range]:disabled{opacity:.4;cursor:default}
.note-warn{margin:2px 0 0;color:#E9B35C;font:12.5px/16px var(--sans)}
.sw-notes{margin:0;padding:10px 12px;border-left:2px solid var(--line2);color:var(--text2);font:13px/18px var(--sans);white-space:pre-line;overflow-wrap:anywhere}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand-room{display:inline-block;max-width:26vw;margin-left:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:-1px;color:var(--muted);font:500 11px/16px var(--mono);font-style:normal;letter-spacing:.14em;text-transform:uppercase}
.rn-addr{color:var(--cream);font:500 13px/18px var(--mono);overflow-wrap:anywhere}
.rn-apply{display:flex;flex-direction:column;gap:8px}
.rn-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rn-step{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--text2);font:13px/18px var(--sans)}
.rn-st{color:var(--muted);text-align:right;overflow-wrap:anywhere;min-width:0}
.rn-step.working .rn-st{color:#E9B35C}.rn-step.done .rn-st{color:var(--brass)}.rn-step.failed .rn-st{color:#F07A62}
.sw-why{color:var(--text2)}
.li-act:disabled{opacity:.5;cursor:default}
.cf{display:flex;align-items:center;gap:16px;margin-top:6px}
.cf-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.cf-ring{flex:none;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(closest-side,#241810 79%,transparent 80% 100%),conic-gradient(var(--amber) var(--p),var(--line) 0)}
.cf-count{color:var(--amber);font:600 22px/1 var(--mono);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){ .cf-ring{animation:cf-breathe 2.4s ease-in-out infinite} }
@keyframes cf-breathe{50%{box-shadow:0 0 18px rgba(255,178,56,.28)}}
.li-danger{width:100%;text-align:left;border:0;background:none;padding:0;min-height:44px;color:var(--red-text);font:600 15px/20px var(--sans)}
input[type=range]{width:100%;height:44px;margin:0;background:none;-webkit-appearance:none;appearance:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--amber) var(--pct,50%),var(--line) var(--pct,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--amber) var(--pct,50%),var(--line) var(--pct,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-10px;border-radius:50%;border:0;background:radial-gradient(circle at 40% 30%,#F0D59A,#C9A15A 55%,#7A5A2C)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;border:0;background:radial-gradient(circle at 40% 30%,#F0D59A,#C9A15A 55%,#7A5A2C)}
.steps{margin:0;padding-left:22px;color:var(--text2);font-size:14px}
.steps li{margin:0 0 6px}
.steps b{color:var(--cream);font-weight:600}
.steps li::marker{font-family:var(--mono);color:var(--muted)}
details.how summary{cursor:pointer;color:var(--brass);font:600 13px/20px var(--sans);min-height:44px;display:flex;align-items:center;list-style:none}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"›";display:inline-block;width:14px;transition:transform .15s}
details.how[open] summary::before{transform:rotate(90deg)}
.about{margin:auto 0 0;padding-top:28px;display:flex;flex-direction:column;align-items:center;gap:10px}
.about p{margin:0;color:var(--muted);font-size:12px}
.ent{display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:60px;border-top:1px solid var(--line)}
.ent-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ent-name{color:var(--cream);font:600 14px/18px var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent-sub{color:var(--muted);font:9.5px/12px var(--mono);letter-spacing:.06em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .btn.small{min-height:44px;padding:8px 12px;font-size:13px}
.area-h{padding:14px 16px 6px;color:var(--brass);font:600 15px/20px var(--serif);border-top:1px solid var(--line)}
.list .area-h:first-child{border-top:0}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5FBF7A;box-shadow:0 0 6px rgba(95,191,122,.7);margin-right:8px;vertical-align:1px}
.inst{display:flex;flex-direction:column;gap:6px}
.miss-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid rgba(217,68,43,.2);min-width:0}
.miss-row span{min-width:0;color:var(--text2);font:12px/16px var(--mono);overflow-wrap:anywhere}
.hstack{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- knobs: live reading + calibration ---------- */
.kn{display:block;padding:0;min-height:0}
.kn-head{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;border:0;background:none;text-align:left;color:inherit}
.kn-head:hover{background:rgba(201,161,90,.04)}
.kn-head .chev{transition:transform .15s}
.kn-head[aria-expanded="true"] .chev{transform:rotate(90deg)}
.kn-txt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.kn-name{color:var(--cream);font:600 16px/20px var(--serif)}
.kn-tag{padding:2px 6px;border-radius:4px;border:1px solid var(--line2);color:var(--muted);font:9px/12px var(--mono);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.kn-tag.box{border-color:rgba(255,178,56,.45);color:var(--amber)}
.kn-num{margin-left:auto;color:var(--brass);font:600 20px/24px var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.kn-body{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}
.lc-wrap{border-top:1px solid var(--line)}
.lc-wrap:first-child{border-top:0}
.lc-body{gap:14px}
.lc-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--well);overflow:hidden}
.lc-col + .lc-col{border-top:1px solid var(--line)}
.lc-head{min-height:56px}
.lc-sw{flex:none;width:28px;height:28px;border-radius:50%;background:var(--line)}
.lc-ch{display:flex;flex-direction:column}
.lc-chrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--cream);font:600 14px/18px var(--sans)}
.lc-fine{color:var(--muted);font-weight:500;font-size:12px}
.lc-r input[type=range]{--amber:#E2553F}
.lc-g input[type=range]{--amber:#5DBB63}
.lc-b input[type=range]{--amber:#5A8CE8}
.kn-bar{position:relative;height:8px;border-radius:4px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.kn-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px;background:linear-gradient(90deg,#8C6A3A,var(--amber));transition:width .2s}
.kn-raw{margin:0;color:var(--muted);font:11px/15px var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kn-raw.bad{color:#F07A62}
.kn-curve{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:var(--well)}
.kn-pos{display:flex;flex-wrap:wrap;gap:6px}
.kn-pos span{min-height:30px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font:700 13px/16px var(--sans)}
.kn-pos span[aria-current="true"]{background:var(--cream);border-color:var(--cream);color:#1E140C}
/* knobs: what each knob does (/api/knobs/functions) */
.kn-sub{padding:6px 4px 0}
.fx-now{color:var(--muted);font:13px/18px var(--sans)}
.fx-q{margin:0;color:var(--muted);font:10px/14px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.fx-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0;padding:0;border:0;min-width:0}
.fx-opts legend{grid-column:1 / -1}
.fx-desc{margin:-4px 0 0;color:var(--text2);font:13px/18px var(--sans)}
@media (max-width:599px){ .fx-od{display:none} .fx-opt{align-items:center} }
@media (min-width:600px){ .fx-desc{display:none} }
.fx-opt{position:relative;display:flex;align-items:flex-start;gap:10px;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--well);cursor:pointer}
.fx-opt:hover{border-color:var(--line2)}
.fx-opt input{appearance:none;-webkit-appearance:none;flex:none;width:18px;height:18px;margin:1px 0 0;border:1.5px solid var(--line2);border-radius:50%;background:none;cursor:pointer}
.fx-opt input:checked{border-color:var(--amber);background:radial-gradient(circle,var(--amber) 0 4px,transparent 4.5px)}
.fx-opt input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.fx-opt:has(input:checked){border-color:rgba(255,178,56,.55);background:rgba(255,178,56,.06)}
.fx-ot{display:flex;flex-direction:column;gap:2px;min-width:0}
.fx-ol{color:var(--cream);font:600 14px/18px var(--sans)}
.fx-ol small{margin-left:6px;color:var(--muted);font:9px/12px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.fx-od{color:var(--muted);font:12.5px/17px var(--sans)}
.fx-par{display:flex;flex-direction:column;gap:0}
.fx-ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.fx-ph label{color:var(--cream);font:600 14px/18px var(--sans)}
.fx-pos{display:flex;flex-direction:column;gap:6px}
.fx-ends{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font:11px/14px var(--sans)}
.fx-try{margin:0;padding:10px 12px;border-left:2px solid var(--amber);background:rgba(255,178,56,.06);color:var(--cream);font:13.5px/18px var(--sans)}
.fx-try b{color:var(--amber);font-variant-numeric:tabular-nums}
.fx-pars details.how > div{display:flex;flex-direction:column;gap:4px}
.wz{display:flex;flex-direction:column;gap:14px}
.wz-say{margin:0;color:var(--title);font:600 26px/31px var(--serif)}
.wz-note{margin:0;color:var(--text2);font-size:14px;line-height:20px}
.wz-note b{color:var(--amber)}
.wz-live{display:flex;align-items:center;gap:18px;padding:8px 0}
.wz-dial{flex:none}
.wz-read{display:flex;flex-direction:column;gap:6px;min-width:0}
.wz-raw{color:var(--cream);font:600 32px/36px var(--mono);font-variant-numeric:tabular-nums}
.wz-stab{display:inline-flex;align-items:center;gap:7px;color:var(--amber);font:700 14px/18px var(--sans)}
.wz-stab::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
.wz-stab.ok{color:#7FD093}
.wz-stab.bad{color:#F07A62}
.btn.big{min-height:60px;font-size:18px;border-radius:14px}
.wz-pts{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--well)}
.wz-pts li{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 4px 0 12px;border-top:1px solid var(--line);font-size:14px}
.wz-pts li:first-child{border-top:0}
.wz-pts li[aria-current="true"]{box-shadow:inset 3px 0 0 var(--amber)}
.wz-pts .n{flex:1;min-width:0;color:var(--text2)}
.wz-pts .r{color:var(--brass);font:12px/16px var(--mono);font-variant-numeric:tabular-nums}
.wz-pts li.redo .n,.wz-pts li.redo .r{color:#F07A62}
.wz-pts .link{min-height:44px;padding:8px 10px}
.wz-try{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.wz-try b{color:var(--amber);font:600 34px/38px var(--mono);font-variant-numeric:tabular-nums}

/* ---------- sources & casting ---------- */
.src-row{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 4px;min-height:60px;border-top:1px solid var(--line)}
.src-row:first-child{border-top:0}
.src-chk{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:52px;padding-left:10px;cursor:pointer}
.src-chk input,.lp-row input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--amber);cursor:pointer}
.src-pos{flex:none;width:22px;color:var(--amber);font:600 13px/16px var(--mono);text-align:center}
.src-row.off .src-pos{color:transparent}
.src-row.na .li-title{color:var(--text2)}
.ord{flex:none;width:44px;height:44px;border:0;background:none;padding:0;position:relative;display:inline-flex;align-items:center;justify-content:center;color:var(--brass)}
.ord::before{content:"";position:absolute;inset:5px;border:1px solid var(--line2);border-radius:50%}
.ord:hover:not(:disabled)::before{border-color:var(--amber)}
.ord svg{position:relative}
.ord:disabled{opacity:.3;cursor:default}
.cast{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-top:1px solid var(--line)}
.cast:first-child{border-top:0}
#castBox p,#srcGroup p{margin:0}
.cast-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cast .switch{min-height:44px}
.cast-state{display:inline-flex;align-items:center;gap:6px}
.cast-state::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line2)}
.cast-state.on::before{background:#5FBF7A;box-shadow:0 0 6px rgba(95,191,122,.6)}
.cast-state.wait::before{background:var(--amber);box-shadow:0 0 6px rgba(255,178,56,.6)}
.cast-name{display:flex;gap:8px;align-items:center}
.cast-name input{flex:1;min-width:0}
.now-line{margin:0;padding:12px 16px;color:var(--text2);font-size:14px;line-height:20px;border-bottom:1px solid var(--line)}
.now-line b{color:var(--cream);font-weight:600}
/* Bluetooth: phones, what's playing, the radio keys (/api/bluetooth) */
.bt-sec{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-top:1px solid var(--line)}
.bt-h{margin:0;color:var(--muted);font:10px/14px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.bt-dev{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:12px;row-gap:4px;align-items:center;padding:10px 0 4px;border-top:1px solid var(--line)}
.bt-h + .bt-dev{border-top:0;padding-top:4px}
.bt-ic{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--brass)}
.bt-dev.on .bt-ic,.bt-play .bt-ic{color:var(--amber);border-color:rgba(255,178,56,.5);box-shadow:0 0 10px rgba(255,178,56,.18)}
.bt-name{color:var(--cream);font:600 15px/20px var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt-acts{grid-column:2;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bt-acts .link{padding:10px 8px}
.bt-play{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:12px;align-items:start}
.bt-play .li-txt{gap:4px}
.bt-song{color:var(--text2);font-size:14px;line-height:19px;overflow-wrap:anywhere}
.bt-codec{align-self:flex-start;display:inline-flex;align-items:center;min-height:24px;margin-top:2px;padding:2px 10px;border:1px solid var(--line2);border-radius:999px;color:var(--brass);font:600 11px/16px var(--mono);letter-spacing:.04em;cursor:help}
.bt-codec.hi{color:var(--amber);border-color:rgba(255,178,56,.5)}
.bt-sec .switch{min-height:52px}
.bt-opt{display:flex;flex-direction:column;gap:6px;padding:2px 0 6px}
.bt-opt > span{color:var(--text2);font:600 13px/18px var(--sans)}
.bt-err{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
#castBox .bt-sec p{margin:0}
.bt-busy{opacity:.55;cursor:default}

/* ---------- multiroom: rooms on the remote, Multiroom in settings ---------- */
.rooms{border:1px solid var(--line);border-radius:14px;background:var(--sheet);overflow:hidden}
.rooms:empty{display:none}
.rooms-head{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 8px 8px 14px}
.rooms-ic{flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--brass);border:1px solid var(--line2)}
.rooms.grouped .rooms-ic{color:var(--amber);border-color:rgba(255,178,56,.5);box-shadow:0 0 10px rgba(255,178,56,.18)}
.rooms-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rooms-title{color:var(--cream);font:600 14px/18px var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rooms-title b{color:var(--title);font:600 15px/18px var(--serif)}
.rooms-sub{color:var(--muted);font-size:12.5px;line-height:16px;overflow-wrap:anywhere}
.rooms-btn{flex:none;display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 10px;border:0;background:none;color:var(--brass);font:600 13px/16px var(--sans)}
.rooms-btn:hover{color:#E0BC78}
.rooms-btn .chev{color:inherit;transition:transform .15s}
.rooms-btn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.rooms-body{display:flex;flex-direction:column;gap:2px;padding:0 14px 12px;border-top:1px solid var(--line)}
.rooms-body .hint{padding:10px 0 4px}
.room{display:flex;align-items:center;gap:10px;min-height:56px;border-top:1px solid var(--line)}
.room:first-of-type{border-top:0}
.room .switch{flex:1;min-width:0}
.room .li-txt{gap:1px}
.room-sub{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;line-height:16px}
.room-sub::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--line2)}
.room-sub.on::before{background:#5FBF7A;box-shadow:0 0 6px rgba(95,191,122,.6)}
.room-sub.wait::before{background:var(--amber);box-shadow:0 0 6px rgba(255,178,56,.6)}
.room.off .li-title{color:var(--text2)}
.room .switch input:disabled{opacity:.4;cursor:default}
.rooms-empty{margin:0;padding:14px 0 6px;color:var(--text2);font-size:13.5px;line-height:19px}
.rooms-empty b{display:block;color:var(--cream);font-weight:600}
.rooms-err{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0 4px}
.picker.plain{border:0;padding:0;background:none}

/* ---------- Home Assistant behaviours on a key ---------- */
.lp-list{max-height:360px;overflow:auto}
.lp-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 10px;border-radius:8px;cursor:pointer}
.lp-row:hover{background:#2A1D13}
.lp-row .lp-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lp-row .lp-name{color:var(--cream);font:600 14px/18px var(--sans)}
.lp-row .lp-sub{color:var(--muted);font-size:12px;line-height:16px}
.lp-row.na .lp-name{color:var(--text2)}
.picked-names{display:flex;flex-wrap:wrap;gap:6px}
.picked-names span{padding:4px 10px;border:1px solid var(--line2);border-radius:999px;color:var(--cream);font:600 13px/18px var(--sans)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.swatch{position:relative;width:100%;min-width:44px;height:44px;border:2px solid transparent;border-radius:10px;padding:0;background:var(--c)}
.swatch[aria-checked="true"]{border-color:var(--cream);box-shadow:0 0 0 2px var(--ground),0 0 0 4px var(--amber)}
.swatch.custom{display:flex;align-items:center;justify-content:center;background:conic-gradient(from 90deg,#ff5e3a,#ffd36b,#3ccf6e,#4fb4ff,#9a5bff,#ff4f7b,#ff5e3a);overflow:hidden}
.swatch.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
input[type=range].kel::-webkit-slider-runnable-track{background:linear-gradient(90deg,#FF9A3C,#FFE2B8 45%,#F4F1FF 70%,#B8D2FF)}
input[type=range].kel::-moz-range-track{background:linear-gradient(90deg,#FF9A3C,#FFE2B8 45%,#F4F1FF 70%,#B8D2FF)}
.try-box{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--well);font-size:13.5px;line-height:18px}
.try-box.ok{border-color:rgba(95,191,122,.45);color:#BFE6C8}
.try-box.bad{border-color:rgba(217,68,43,.5);color:#F3C0B4}
.try-box ul{margin:0;padding-left:18px;color:#E9B35C}
.ha-ed{display:flex;flex-direction:column;gap:14px}
.field > label.switch{color:inherit;font:inherit;letter-spacing:0;text-transform:none}
.sub-lbl{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sub-lbl label,.sub-lbl > span:first-child{color:var(--muted);font:10px/14px var(--mono);letter-spacing:.14em;text-transform:uppercase}
select{width:100%;min-height:46px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--well);color:var(--cream);font:15px/20px var(--sans)}
select:focus-visible{outline:2px solid var(--amber);outline-offset:1px}

/* ---------- dialog / toast ---------- */
dialog{width:min(440px,100vw);max-width:100vw;margin:auto auto 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));border:0;border-top:1px solid var(--line2);border-radius:22px 22px 0 0;
  background:linear-gradient(180deg,#2A1C12,#1F150D);color:var(--cream);max-height:85vh;overflow:auto}
dialog::backdrop{background:rgba(10,6,3,.62)}
@media (min-width:600px){ dialog{margin:auto;border:1px solid var(--line2);border-radius:18px} }
dialog h2{margin:0 0 4px;color:var(--title);font:600 22px/28px var(--serif)}
dialog .sub{margin:0 0 14px;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));z-index:50;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  max-width:calc(100vw - 32px);padding:11px 16px;border-radius:12px;border:1px solid var(--line2);background:#2A1C12;color:var(--cream);font:600 14px/18px var(--sans);
  box-shadow:0 10px 30px rgba(0,0,0,.5);transition:opacity .2s,transform .2s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:rgba(217,68,43,.6);color:#F7C9BD}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important;animation-iteration-count:1 !important;scroll-behavior:auto !important}
}
@media (max-width:959px){ .app[data-view="edit"]{padding-bottom:0} }

/* ---------- settings: home list, pages, shared bars ---------- */
.set-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--sheet);overflow:hidden}
.set-row{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 14px 12px 16px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.set-row:first-child{border-top:0}
.set-row:hover{background:rgba(201,161,90,.05)}
.set-row:focus-visible{outline-offset:-3px}
.set-row .li-txt{flex:1}
.set-row .li-sub{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.set-row .chev{flex:none;color:var(--brass)}
.set-ic{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--well);border:1px solid var(--line);color:var(--brass)}
.attn{border-color:rgba(233,179,92,.45);background:linear-gradient(180deg,#2A1D10,#21160D)}
.attn .set-row .li-title{color:#F3CF8C}
.attn-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px rgba(255,178,56,.6)}
.ver{background:none;border:0;padding:6px 8px;min-height:32px;color:var(--muted);font:12px/16px var(--mono);letter-spacing:.04em;cursor:default;-webkit-user-select:none;user-select:none}
.ver:focus-visible{outline-offset:0}
.ro-line{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ro-line .li-sub{flex:1 1 200px}
.help-url{font:13px/18px var(--mono);letter-spacing:0;color:var(--cream);text-overflow:ellipsis}
.help-v{font:600 13px/18px var(--mono);letter-spacing:0;overflow-wrap:anywhere;text-align:right}
/* "A maker is connected now (…)" vs "Connected - waiting for a maker": the line the owner looks for */
.help-now{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;color:var(--cream);font:600 16px/22px var(--sans)}
.help-now .hn-dot{flex:0 0 10px;width:10px;height:10px;border-radius:50%;background:var(--brass)}
.help-now.on{border-color:#4E7A57;background:rgba(93,187,99,.10)}
.help-now.on .hn-dot{background:#5DBB63;box-shadow:0 0 0 3px rgba(93,187,99,.22)}
@keyframes hn-breathe{50%{box-shadow:0 0 0 6px rgba(93,187,99,.08)}}
@media (prefers-reduced-motion:no-preference){ .help-now.on .hn-dot{animation:hn-breathe 2.4s ease-in-out infinite} }
.title-row .pv-pill{margin-left:auto}
.pv-pill{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 4px 0 12px;border:1px solid rgba(255,178,56,.5);border-radius:18px;background:#2A1C10;color:#F3CF8C;font:600 12.5px/16px var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.pv-pill .pv-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 6px rgba(255,178,56,.8)}
@media (prefers-reduced-motion:no-preference){ .pv-pill .pv-dot{animation:cf-breathe 1.6s ease-in-out infinite} }
.pv-pill button{min-height:36px;min-width:44px;padding:0 10px;border:0;border-radius:14px;background:var(--amber);color:#1A1208;font:800 12.5px/16px var(--sans)}
.pv-pill .pv-short{display:none}
@media (max-width:420px){ .pv-pill .pv-what{display:none} .pv-pill .pv-short{display:inline} }
.app[data-view="settings"] .panel > .title-row{position:sticky;top:0;z-index:15;margin:0 -16px;padding:6px 16px;background:var(--ground)}
@media (min-width:960px){ .app[data-view="settings"] .panel > .title-row{margin:0;padding:6px 0} }
.savebar{position:sticky;bottom:0;z-index:20;display:flex;align-items:center;gap:10px;margin:8px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line2);background:rgba(31,20,13,.97);box-shadow:0 -10px 24px rgba(0,0,0,.45)}
.savebar[hidden]{display:none !important}
.savebar .sb-txt{flex:1;min-width:0;color:#F3CF8C;font:600 14px/18px var(--sans)}
.savebar .sb-txt small{display:block;color:var(--muted);font-weight:400;font-size:12px;line-height:16px}
.savebar .btn.small{min-width:84px}
@media (min-width:960px){ .savebar{margin:8px 0 0;border:1px solid var(--line2);border-radius:14px} }
html.has-bar{scroll-padding-bottom:110px}
html.has-bar .toast{bottom:calc(92px + env(safe-area-inset-bottom))}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px;text-align:left;padding:6px 6px 6px 16px;width:max-content;max-width:min(400px,calc(100vw - 32px))}
.toast.act > span{flex:1;min-width:0}
.toast-undo{flex:none;min-height:44px;min-width:64px;padding:0 14px;border:1px solid var(--line2);border-radius:10px;background:none;color:var(--amber);font:800 14px/18px var(--sans)}
.diag{margin:0;padding:10px 12px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--well);color:var(--text2);font:11.5px/16px var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.chk{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.chk:last-child{border-bottom:0}
.chk b{font-weight:600}.chk .ok{color:#8FCF9F}.chk .no{color:#F07A62}
.danger-row{display:flex;flex-direction:column;gap:6px;margin-top:6px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--sheet)}
</style>
</head>
<body>
<div class="app" id="app" data-view="remote">
  <section class="remote" id="remote" aria-label="Remote">
    <header class="top">
      <h1 class="brand">Hasler</h1>
      <div class="top-btns">
        <button type="button" class="pill panel-remote-only" id="goBrowse" aria-label="Browse music">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5v11M5.5 2.5v11M8.5 3l3.2 10.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Browse</span>
        </button>
        <button type="button" class="round" id="goEdit" aria-label="Edit keys" title="Edit keys">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13l.6-2.6L10.8 3.2a1.4 1.4 0 0 1 2 0a1.4 1.4 0 0 1 0 2L5.6 12.4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="round" id="goSettings" aria-label="Settings" title="Settings">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="bezel">
      <div class="glass" id="glass">
        <div class="dial-head"><span id="dialHead">Tuning…</span><span aria-hidden="true">Hasler · D&amp;M</span></div>
        <h2 class="dial-name" id="dialName">Hasler</h2>
        <div class="song" id="song">
          <span class="cover radio" id="cover" aria-hidden="true"></span>
          <div class="song-txt"><span class="song-title" id="songTitle"></span><span class="song-sub" id="songSub"></span></div>
        </div>
        <div class="scale" id="scale" aria-hidden="true"><div class="strip still" id="stripEl"></div><div class="needle"></div></div>
      </div>
    </div>
    <p class="sr" id="nowLive" aria-live="polite"></p>

    <div class="bank" id="bank" role="group" aria-label="Piano keys"></div>

    <div class="controls">
      <div class="ctl">
        <button type="button" class="ctl-btn" id="standbyBtn" aria-pressed="false" aria-label="Standby">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M5.8 5.6a6 6 0 1 0 8.4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <span class="ctl-lbl" id="standbyLbl" aria-hidden="true">Standby</span>
      </div>
      <div class="ctl">
        <svg class="knob" id="knob" width="132" height="132" viewBox="0 0 132 132" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <defs>
            <radialGradient id="kg1" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#F0D59A"/><stop offset="0.55" stop-color="#C9A15A"/><stop offset="1" stop-color="#7A5A2C"/></radialGradient>
            <radialGradient id="kg2" cx="0.45" cy="0.35" r="0.75"><stop offset="0" stop-color="#E8CA8A"/><stop offset="1" stop-color="#9A7638"/></radialGradient>
          </defs>
          <path d="M30 104l-5 5M22 82h-7M30 40l-5-5M66 22v-7M102 40l5-5M110 82h7M102 104l5 5" fill="none" stroke="#5A4128" stroke-width="2" stroke-linecap="round"/>
          <path id="kTrack" fill="none" stroke="#3A2A1C" stroke-width="4" stroke-linecap="round"/>
          <path id="kArc" fill="none" stroke="#FFB238" stroke-width="4" stroke-linecap="round"/>
          <path id="kCeil" fill="none" stroke="#D9442B" stroke-width="2" stroke-linecap="round"/>
          <circle cx="66" cy="66" r="36" fill="url(#kg1)"/>
          <circle cx="66" cy="66" r="36" fill="none" stroke="rgba(58,42,18,.6)"/>
          <circle cx="66" cy="66" r="27" fill="url(#kg2)"/>
          <rect id="kPtr" x="64" y="34" width="4" height="14" rx="2" fill="#2A1C10"/>
        </svg>
        <span class="vol-lbl" id="volLbl" aria-hidden="true">VOLUME · —</span>
      </div>
      <div class="ctl">
        <button type="button" class="ctl-btn" id="nextBtn" aria-label="Next">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4.5l8 5.5-8 5.5z" fill="currentColor"/><rect x="13.5" y="4.5" width="2.2" height="11" rx="1" fill="currentColor"/></svg>
        </button>
        <span class="ctl-lbl" aria-hidden="true">Next</span>
      </div>
    </div>

    <div class="tone" id="tone" hidden aria-live="off">
      <span>Tone</span>
      <span aria-hidden="true" id="toneLo">Dark</span>
      <div class="tone-bar" role="meter" id="toneBar" aria-label="Tone" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span class="tone-mid"></span><span class="tone-dot" id="toneDot" style="left:50%"></span></div>
      <span aria-hidden="true" id="toneHi">Bright</span>
      <span class="tone-db" id="toneDb">—</span>
    </div>

    <div class="rooms" id="rooms" role="region" aria-label="Rooms"></div>

async function testPreset(p){
  const btn = $('testBtn');
  if (!(p.uri || '').trim()){ saveMsg = {text:'Choose something to play first.', bad:true}; rerender(); return; }
  if (btn){ btn.disabled = true; btn.textContent = 'Tuning in…'; }
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await api('POST', '/api/play', {preset:{name:(p.name || '').trim() || 'Test', source:p.source, uri:p.uri.trim(), shuffle: p.source !== 'radio' && !!p.shuffle}}, {signal: ctl.signal});
    if (r.json && r.json.ok){ saveMsg = {text:'Playing on the radio.', bad:false}; }
    else saveMsg = {text:(r.json && r.json.error) || 'Couldn’t play that (error ' + r.status + ').', bad:true};
  } catch (e) { saveMsg = {text: e.name === 'AbortError' ? 'The radio took too long to answer.' : NET_ERR, bad:true}; }
  clearTimeout(t); rerender(); pollSoon();
}
async function save(){

  saving = true; saveMsg = {text:'', bad:false}; rerender();
  const body = payload(draft); lastSent = body;
  const cbWas = !ed.key && ed.combo ? comboById(ed.combo) : null;
  const label = cbWas ? comboName(cbWas) : ed.key ? keyLabel(draft.keys.find(k => k.id === ed.key)) : 'Keys';
  let focusAfter = null;
  try {
    const r = await api('PUT', '/api/config', body);
    if (r.ok && r.json && r.json.ok){
      errs = {}; hints = {}; general = [];
      adopt(r.json.config || Object.assign({}, cfg, body));
      saveMsg = {text: label + ' saved to the radio.', bad:false};
      // A saved combination closes its editor, back to its row.
      if (cbWas){ ed.combo = null; ed.pick = null; ed.ent = null; ed.lp = null; saveMsg = {text:'', bad:false}; focusAfter = 'cedit-' + comboPairId(cbWas.keys); }
      toast(label + ' saved');
      buildBank();
      refreshHa();
    } else if (r.json && Array.isArray(r.json.errors) && r.json.errors.length){
      applyServerErrors(r.json.errors);
      const cur = draft.keys.find(k => k.id === ed.key), curC = !ed.key && ed.combo ? comboById(ed.combo) : null;
      const badC = (draft.combos || []).filter(c => comboErr(c));

      }

      saveMsg = {text:'Not saved — ' + (bad.length ? 'check ' + bad.join(', ') : 'see the message above') + '.', bad:true};
    } else {
      general = [(r.json && (r.json.error || r.json.message)) || 'Saving failed (error ' + r.status + ').'];
      saveMsg = {text:'Not saved.', bad:true};

  saving = false; rerender();

/* ================= change a key from elsewhere (Browse, HA) ================= */
async function applyToKey(mutate, okMsg){
  try {
    const g = await api('GET', '/api/config');
    if (!g.ok || !g.json || !Array.isArray(g.json.keys)) throw new Error('config');
    const base = {keys: clone(g.json.keys), presets: clone(g.json.presets || [])};
    mutate(base);
    const body = payload(base);
    const r = await api('PUT', '/api/config', body);
    if (r.ok && r.json && r.json.ok){
      const wasDirty = isDirty(), keep = draft;
      adopt(r.json.config || Object.assign({}, g.json, body));
      if (wasDirty && keep){ mutate(keep); draft = keep; }
      buildBank(); renderRemote(); refreshHa();
      toast(okMsg);
      return true;
    }
    const e = r.json && ((r.json.errors && r.json.errors[0] && r.json.errors[0].message) || r.json.error);
    toast('Not saved — ' + (e || 'error ' + r.status), true);
  } catch (_) { toast(NET_ERR, true); }
  return false;
}

    const base = {keys: clone(g.json.keys), presets: clone(g.json.presets || []), combos: g.json.combos.map(e => comboIn(clone(e)))};
    mutate(base.combos);
    const body = payload(base);
    const r = await api('PUT', '/api/config', body);
    if (r.ok && r.json && r.json.ok){
      const wasDirty = isDirty(), keep = draft;
      adopt(r.json.config || Object.assign({}, g.json, body));
      if (wasDirty && keep){ if (keep.combos) mutate(keep.combos); draft = keep; }

}

async function helpStart(){

async function helpCopy(){

  if (t.mode === 'sun' && t.polar === 'day') return 'The sun stays up today — no night';

/* ---- pilot lamp: Lamp colours (calibrate the palette by eye; GET/PUT /api/lamp/palette, POST /api/lamp/preview) ---- */
const LCAL_NAMES = {amber:'Amber', amber_pale:'Pale amber', ember:'Ember', blue:'Blue', magenta:'Magenta', white:'Warm white', red:'Red'};
const LCAL_LEVELS = {full:'Full', night:'Night', ember:'Ember'};
const LCAL_PAIRS = [['amber','ember'], ['blue','magenta'], ['amber','red']];
const LCAL_CH = [['Red', 'r', false], ['Green', 'g', true], ['Blue', 'b', true]];   // label, id, square-root scale
const lcal = {open:false, data:null, err:'', loading:false, busy:false, draft:{}, level:{}, sel:null, pair:0,
  run:null, live:'', showing:false, drag:false, pending:false, sent:0, timer:null, queued:null};
const lcalName = n => LCAL_NAMES[n] || n.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
const lcalNames = () => lcal.data ? Object.keys(lcal.data.defaults) : [];
const lcalSame = (a, b) => !!a && !!b && a.every((v, i) => Math.abs(v - b[i]) < 1e-6);
const lcalDirty = () => lcalNames().some(n => !lcalSame(lcal.draft[n], lcal.data.effective[n]));
const lcalLevelOf = n => lcal.level[n] || (n === 'ember' ? 'ember' : 'full');
// The swatch: the LED's linear mix seen through gamma, never fully dark so dim levels still read.
function lcalCss(rgb, lv){
  const k = 0.4 + 0.6 * ((lcal.data && lcal.data.levels[lv]) ?? 1);
  return 'rgb(' + rgb.map(c => Math.round(255 * k * Math.pow(Math.min(1, Math.max(0, c)), 1 / 2.2))).join(',') + ')';
}
function lcalSw(n){ const c = lcalCss(lcal.draft[n], lcalLevelOf(n)); return 'background:' + c + ';box-shadow:inset 0 0 0 1px rgba(237,227,204,.18),0 0 12px ' + c; }
async function lcalLoad(){
  lcal.loading = true; lcal.err = '';
  try {
    const r = await api('GET', '/api/lamp/palette');
    if (r.ok && r.json && r.json.defaults){ lcal.data = r.json; lcalAdopt(); }
    else lcal.err = r.status === 404 ? 'This radio’s software is too old for this — update it first.' : 'Couldn’t read the lamp colours.';
  } catch (_) { lcal.err = NET_ERR; }
  lcal.loading = false;
  if (view === 'settings') rerender();
}
function lcalAdopt(){
  lcal.draft = {};
  for (const n of lcalNames()) lcal.draft[n] = lcal.data.effective[n].slice();
  if (!lcal.sel || !lcal.draft[lcal.sel]) lcal.sel = null;
}
// At most ~10 previews a second; the last one always goes.
function lcalPreview(body){
  lcal.queued = body;
  if (lcal.timer) return;
  lcal.timer = setTimeout(lcalFlush, Math.max(0, lcal.sent + 100 - Date.now()));
}
function lcalFlush(){
  lcal.timer = null;
  const body = lcal.queued; lcal.queued = null;
  if (!body) return;
  lcal.sent = Date.now(); lcal.showing = body.rgb != null;
  api('POST', '/api/lamp/preview', body).catch(() => {});
}
function lcalShow(n){ lcalPreview({rgb: lcal.draft[n], level: lcalLevelOf(n)}); }
// Back to what the lamp was doing: Done, collapsing, leaving Settings, hiding the page.
function lcalEnd(){
  lcalStop(false);
  clearTimeout(lcal.timer); lcal.timer = null; lcal.queued = null;
  if (!lcal.showing) return;
  lcal.showing = false;
  try {
    fetch('/api/lamp/preview', {method:'POST', keepalive:true, cache:'no-store',
      headers:{'Content-Type':'application/json'}, body:'{"rgb":null}'}).catch(() => {});
  } catch (_) {}
}
function lcalSay(text){ lcal.live = text; const el = $('lcalLive'); if (el) el.textContent = text; }
function lcalStop(render = true){
  if (!lcal.run) return;
  clearTimeout(lcal.run.timer); lcal.run = null; lcalSay('');

// Shown at once; put back if the radio says no.
async function btPutSet(patch, undoable){
  const old = btDoc.settings;
  const back = {};
  for (const grpK of ['keys', 'reconnect']) if (patch[grpK]){ back[grpK] = {}; for (const f of Object.keys(patch[grpK])) back[grpK][f] = (old[grpK] || {})[f]; }
  if ('phone_volume' in patch) back.phone_volume = old.phone_volume !== false;
  const next = {keys: Object.assign({}, old.keys, patch.keys), reconnect: Object.assign({}, old.reconnect, patch.reconnect)};
  if ('phone_volume' in patch || 'phone_volume' in old) next.phone_volume = 'phone_volume' in patch ? patch.phone_volume : old.phone_volume;
  btDoc.settings = next; btUi.err = null; paintCast(); if (view === 'edit') rerender();
  const seq = ++btSetSeq; btUi.saving++;
  let fail = '';
  try {
    const r = await api('PUT', '/api/bluetooth/settings', next);
    btUi.saving--;
    if (seq !== btSetSeq) return;   // a newer change is on its way
    if (r.ok && r.json && r.json.ok !== false){
      if (Array.isArray(r.json.devices)) adoptBt(r.json); else if (r.json.settings) btDoc.settings = r.json.settings;
      toast(btSetMsg(patch), undoable ? {undo: () => btPutSet(back, false)} : null);
    } else fail = capFirst((r.json && r.json.error) || 'Not saved (error ' + r.status + ')') + '.';
  } catch (_) { btUi.saving--; if (seq !== btSetSeq) return; fail = NET_ERR; }
  if (fail){ btDoc.settings = old; btUi.err = {msg: fail, retry: () => btPutSet(patch)}; toast(fail, true); }
  paintCast(); if (view === 'edit') rerender();
}
async function pollCasting(){
  const btP = btDoc && btDoc.missing ? null : loadBt();

    const r = await api('GET', '/api/casting');
    if (r.ok && r.json && Array.isArray(r.json.targets)) adoptCasting(r.json);
    else if (r.status !== 404) castErr = {msg: capFirst((r.json && r.json.error) || 'Couldn’t read the casting status (error ' + r.status + ')') + '.', retry: pollCasting};
  } catch (_) { castErr = {msg:NET_ERR, retry: pollCasting}; }
  await btP;
  paintCast();
}

// Resolves with a confirmed token, or null (cancelled, timed out, can't confirm).
function pressToConfirm(action, args, title, sub){
  return new Promise(async resolve => {
    let ask;
    try { ask = await api('POST', '/api/confirm/request', {action, args}); }
    catch (_) { toast(NET_ERR, true); resolve(null); return; }
    const j = ask.json || {};
    if (!ask.ok || !j.token){ toast(j.error || 'The radio can’t confirm this right now.', true); resolve(null); return; }
    if (j.state === 'confirmed'){ resolve(j.token); return; }
    const dlg = $('dlg'); dlg.textContent = '';
    const total = j.expires_in || 30, end = Date.now() + total * 1000;
    let result = null, timer = null, done = false;
    const count = h('b', {class:'cf-count', 'aria-hidden':'true'}, String(total));
    const ring = h('div', {class:'cf-ring', style:'--p:100%'}, count);
    const finish = r => { if (done) return; done = true; result = r; clearTimeout(timer); dlg.close(); };
    const tick = async () => {
      const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      count.textContent = String(left); ring.style.setProperty('--p', (left / total * 100) + '%');
      try {
        const p = await api('GET', '/api/confirm/' + encodeURIComponent(j.token));
        const st = p.json && p.json.state;
        if (st === 'confirmed'){ finish(j.token); return; }
        if (st && st !== 'pending'){ toast('No key was pressed, so nothing changed.'); finish(null); return; }
      } catch (_) {}
      if (!done) timer = setTimeout(tick, 600);
    };
    dlg.append(h('h2', {id:'dlgTitle'}, title || 'Confirm on the radio'), sub ? h('p', {class:'sub'}, sub) : '',
      h('div', {class:'cf'}, ring, h('div', {class:'cf-txt'},
        h('span', {class:'li-title'}, 'Press any key on the radio'),
        h('span', {class:'li-sub'}, 'The pilot lamp dips twice while it waits. That press only confirms — it won’t change the station.'))),
      h('div', {style:'display:flex;justify-content:flex-end;margin-top:14px'}, h('button', {type:'button', class:'btn small', onclick: () => finish(null)}, 'Cancel')));
    dlg.onclose = () => {
      done = true; clearTimeout(timer);
      if (!result) api('DELETE', '/api/confirm/' + encodeURIComponent(j.token)).catch(() => {});
      resolve(result);
    };
    dlg.onclick = null;
    dlg.showModal();
    timer = setTimeout(tick, 400);
  });
}

async function loadKnobs(){

    const r = await api('GET', '/api/knobs');

/* polling: ~4x/s, only for open cards and the wizard's knob, only on Settings */
function knobPollIds(){
  if (document.hidden || !knobs || !knobs.knobs) return [];
  const want = new Set();
  if (onPage('keys')) for (const k of knobs.knobs) want.add(k.id);   // every knob, live
  if (onPage('maker')) for (const id of knobUi.open) want.add(id);   // open curve cards
  if (onPage('sound')) for (const id of fxUi.open) want.add(id);     // the effect card's "knob now" bar
  if (wiz && $('dlg').open) want.add(wiz.k.id);

function knobPoll(now){

  await Promise.all(ids.map(async id => {
    try {

/* drawings (numbers-only markup into icon()) */

    + '<path d="M' + P + ' ' + P + 'V' + (H - P) + 'H' + (W - P) + '" stroke="#3A2A1C" stroke-width="1" fill="none"/>';
  if (c.length > 1) m += '<polyline points="' + c.map(p => X(p[0]) + ',' + Y(p[1])).join(' ') + '" fill="none" stroke="#C9A15A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"'

const FX_TRY_S = 30;
// What the two ends of the knob mean, per effect (the radio may send its own as `ends`).
const FX_ENDS = {treble:['Less treble', 'More treble'], bass:['Less bass', 'More bass'], tilt:['Warmer', 'Brighter'],
  loudness:['Off', 'Full'], presence:['Softer voices', 'Clearer voices'], vintage:['Today', '1960s radio'], width:['Mono', 'Wide stereo']};
const fxEffect = id => (fx && fx.effects || []).find(e => e.id === id) || null;

const fxName = k => k.label || k.id;
function fxParamsFor(e, given){
  const out = {};
  for (const p of (e && e.params) || []){
    const v = given && given[p.id] != null && isFinite(given[p.id]) ? +given[p.id] : +p.default;
    out[p.id] = Math.max(+p.min, Math.min(+p.max, isFinite(v) ? v : +p.min));

}
const fxSaved = k => ({effect: k.effect, params: fxParamsFor(fxEffect(k.effect), k.params)});
const fxDefault = k => ({effect: k.default_effect, params: fxParamsFor(fxEffect(k.default_effect), k.default_params)});

const fxDraft = k => fxUi.draft[k.id] || fxSaved(k);
function fxFmt(e, p, v){
  const u = p.unit || '', n = +v;
  const num = x => String(+(+x).toFixed(2));
  if (/^hz$/i.test(u)) return n >= 1000 ? num(n / 1000) + ' kHz' : num(n) + ' Hz';
  const pm = p.plusminus || (/^db$/i.test(u) && /strength|range|depth|amount/i.test(p.id) && e && /^(treble|bass|tilt|presence)$/.test(e.id));
  return (pm && n > 0 ? '±' : '') + num(n) + (u === '%' ? '%' : u ? ' ' + u : '');
}
function fxSummary(k){
  const e = fxEffect(k.effect);
  if (!e) return k.effect || '—';
  const ps = (e.params || []).slice(0, 1).map(p => fxFmt(e, p, fxParamsFor(e, k.params)[p.id]));
  return e.label + (ps.length ? ' · ' + ps[0] : '');
}

async function loadFx(){
  try {
    const r = await api('GET', '/api/knobs/functions');
    if (r.status === 404) fx = {missing:true};
    else if (r.ok && r.json && Array.isArray(r.json.knobs) && Array.isArray(r.json.effects)) fx = r.json;
    else fx = {err: (r.json && r.json.error) || 'Couldn’t read what the knobs do (error ' + r.status + ').'};
  } catch (_) { fx = {err:NET_ERR}; }
  if (view === 'settings'){ rerender(); knobPoll(true); }
}
function adoptFx(doc){
  if (doc && Array.isArray(doc.knobs) && Array.isArray(doc.effects)) fx = doc;
}

function fxSection(){
  if (!fx || fx.missing) return null;
  if (fx.err) return h('div', {class:'list'}, h('div', {class:'li'}, h('div', {class:'li-txt'},
      h('span', {class:'li-title'}, 'What the knobs do'), h('span', {class:'li-sub'}, fx.err)),
    h('button', {type:'button', class:'li-act', onclick: () => { fx = null; rerender(); loadFx(); }}, 'Try again')));
  // The volume knob is always the volume: only knobs that can be changed are listed here.
  const ks = fx.knobs.filter(k => k.assignable);
  if (!ks.length) return null;
  return h('div', {class:'list'}, ks.map(fxCard));
}
const fxTag = k => { const d = fxDraft(k); return !fxSame(d, fxSaved(k)) ? 'Not saved' : fxSame(fxSaved(k), fxDefault(k)) ? 'As shipped' : 'Yours'; };
function fxCard(k){

    h('span', {class:'kn-name'}, fxName(k)),
    h('span', {class:'fx-now'}, k.note || (/vol/i.test(k.id + ' ' + (k.label || '')) ? 'Always the volume — this one can’t be changed.' : 'This one can’t be changed.'))));
  const open = fxUi.open.has(k.id), d = fxDraft(k), dirty = !fxSame(d, fxSaved(k));
  const head = h('button', {type:'button', class:'kn-head', 'aria-expanded': String(open), 'aria-controls':'fxb-' + id,
      onclick: () => { if (open) fxUi.open.delete(k.id); else fxUi.open.add(k.id); rerender(); knobPoll(true); }},
    h('span', {class:'kn-txt'}, h('span', {class:'kn-name'}, fxName(k)),
      h('span', {class:'fx-now'}, fxSummary(k)),
      h('span', {class:'kn-tag' + (fxTag(k) === 'As shipped' ? '' : ' box'), id:'fxtag-' + id}, fxTag(k))),
    h('span', {class:'chev', style:'margin-left:auto'}, IC.chev()));
  const li = h('div', {class:'li kn'}, head);
  if (!open) return li;
  const e = fxEffect(d.effect), busy = fxUi.busy[k.id], tr = fxUi.trying[k.id];
  li.append(h('div', {class:'kn-body', id:'fxb-' + id},
    h('fieldset', {class:'fx-opts'},
      h('legend', {class:'fx-q', style:'padding:0;margin-bottom:6px'}, 'What this knob does'),
      fx.effects.map(ef => h('label', {class:'fx-opt'},
        h('input', {type:'radio', name:'fx-' + id, id:'fxo-' + id + '-' + kid(ef.id), value: ef.id, checked: ef.id === d.effect,
          onchange: () => fxPick(k, ef.id)}),
        h('span', {class:'fx-ot'}, h('span', {class:'fx-ol'}, ef.label || ef.id, ef.id === k.default_effect ? h('small', null, 'as shipped') : null),
          ef.description ? h('span', {class:'fx-od'}, ef.description) : null)))),
    e && e.description ? h('p', {class:'fx-desc', 'aria-hidden':'true'}, e.description) : null,
    fxParams(k, e, d),
    fxPosBox(k, e),
    tr ? h('p', {class:'fx-try', id:'fxt-' + id, 'aria-live':'polite'}, fxTryText(k)) : null,
    fxUi.err[k.id] ? h('p', {class:'err', role:'alert'}, fxUi.err[k.id]) : null,
    h('div', {class:'acts', style:'align-items:center'},
      h('button', {type:'button', class:'btn small', id:'fxtry-' + id, disabled: !!busy, onclick: () => fxTry(k)}, tr ? 'Play it again' : 'Try it'),
      tr ? h('button', {type:'button', class:'btn small', onclick: fxStopAll}, 'Stop') : null,
      !fxSame(d, fxDefault(k)) ? h('button', {type:'button', class:'link quiet', disabled: !!busy, onclick: () => fxReset(k)}, 'Back to as shipped') : null),
    dirty ? h('p', {class:'hint', style:'margin:0'}, 'Not saved yet — Save at the bottom keeps it.') : null));
