}
function fxParams(k, e, d){
  const ps = (e && e.params) || [];
  if (!e || e.id === 'none') return h('p', {class:'hint'}, 'The knob does nothing while this is chosen.');
  if (!ps.length) return null;
  const rows = ps.map(p => fxSlider(k, e, p, d.params[p.id]));
  if (rows.length <= 2) return h('div', {class:'fx-pars'}, rows);
  return h('div', {class:'fx-pars'}, rows.slice(0, 2),
    h('details', {class:'how', open: fxUi.more && fxUi.more[k.id] ? true : null,
        ontoggle: ev => { fxUi.more = fxUi.more || {}; fxUi.more[k.id] = ev.target.open; }},
      h('summary', null, 'More'), h('div', null, rows.slice(2))));
}
function fxSlider(k, e, p, v){
  const sid = 'fxp-' + kid(k.id) + '-' + kid(p.id), lo = +p.min, hi = +p.max;
  const pct = x => ((x - lo) / ((hi - lo) || 1) * 100) + '%';
  return h('div', {class:'fx-par'},
    h('div', {class:'fx-ph'}, h('label', {for: sid}, p.label || p.id),
      h('span', {class:'li-val', id: sid + '-v', 'aria-hidden':'true'}, fxFmt(e, p, v))),
    h('input', {type:'range', id: sid, min: String(lo), max: String(hi), step: String(p.step || 1), value: String(v),
      'aria-valuetext': fxFmt(e, p, v), style:'--pct:' + pct(v),
      oninput: ev => {
        const n = +ev.target.value, d = fxUi.draft[k.id] || (fxUi.draft[k.id] = clone(fxDraft(k)));
        d.params[p.id] = n;
        ev.target.style.setProperty('--pct', pct(n));
        ev.target.setAttribute('aria-valuetext', fxFmt(e, p, n));
        $(sid + '-v').textContent = fxFmt(e, p, n);
        fxPaintDirty(k);
        // While trying, slider moves go straight to the speaker.
        if (fxUi.trying[k.id]){ clearTimeout(fxUi.resend[k.id]); fxUi.resend[k.id] = setTimeout(() => fxTry(k, true), 300); }
      }}));
}
// Save / tag follow the draft in place: a re-render would drop the slider mid-drag.
function fxPaintDirty(k){
  const t = $('fxtag-' + kid(k.id)); if (t){ const tg = fxTag(k); t.textContent = tg; t.classList.toggle('box', tg !== 'As shipped'); }
  paintSaveBar();
}
function fxPosBox(k, e){
  const id = kid(k.id), live = knobs && knobs.knobs && knobs.knobs.some(x => x.id === k.id);
  if (!live && k.position == null) return null;
  const ends = (e && (e.ends || FX_ENDS[e.id])) || null;
  return h('div', {class:'fx-pos'},
    h('div', {class:'fx-ph'}, h('span', {class:'fx-q'}, 'The knob now'), h('span', {class:'li-val', id:'fxn-' + id}, '—')),
    h('div', {class:'kn-bar', role:'meter', id:'fxm-' + id, 'aria-label': fxName(k) + ' knob position', 'aria-valuemin':'0', 'aria-valuemax':'100'},
      h('span', {class:'kn-fill', id:'fxf-' + id})),
    ends && e.id !== 'none' ? h('div', {class:'fx-ends', 'aria-hidden':'true'}, h('span', null, ends[0]), h('span', null, ends[1])) : null);

// 0-100: the live sample when the calibration poll has one, else the doc's position (0..1).
function fxPos(k){
  const s = knobs && knobs.knobs ? knobUi.live[k.id] : null;
  if (s && !s.err && isFinite(s.value)) return Math.max(0, Math.min(100, +s.value));
  return k.position == null || !isFinite(k.position) ? null : Math.max(0, Math.min(100, k.position * 100));
}
function paintFxLive(knobId){
  const k = fxKnob(knobId); if (!k) return;
  const id = kid(k.id), v = fxPos(k);
  const n = $('fxn-' + id); if (n) n.textContent = v == null ? '—' : String(Math.round(v));
  const f = $('fxf-' + id); if (f) f.style.width = (v == null ? 0 : v) + '%';
  const m = $('fxm-' + id); if (m && v != null) m.setAttribute('aria-valuenow', String(Math.round(v)));
}
function fxPick(k, effectId){
  const saved = fxSaved(k), def = fxDefault(k);
  const params = effectId === saved.effect ? saved.params : effectId === def.effect ? def.params : fxParamsFor(fxEffect(effectId), null);
  fxUi.draft[k.id] = {effect: effectId, params: clone(params)};
  if (fxSame(fxUi.draft[k.id], saved)) delete fxUi.draft[k.id];
  fxUi.err[k.id] = '';
  rerender();
  if (fxUi.trying[k.id]) fxTry(k, true);
}

/* try: the radio plays the draft for 30 s without saving */
function fxTryText(k){
  const left = Math.max(0, Math.ceil(((fxUi.trying[k.id] || 0) - Date.now()) / 1000));
  return h('span', null, 'Trying it for ', h('b', null, left + ' s'), ' — turn the ' + fxName(k) + ' knob to hear it. Nothing is saved yet.');
}
function fxTickAll(){
  let any = false;
  for (const [knobId, end] of Object.entries(fxUi.trying)){
    const k = fxKnob(knobId);
    if (!k || Date.now() >= end){ delete fxUi.trying[knobId]; if (k && onPage('sound')) toast(fxName(k) + ' knob is back to how it was'); if (view === 'settings') rerender(); continue; }
    any = true;
    const el = $('fxt-' + kid(k.id)); if (el){ el.textContent = ''; el.append(fxTryText(k)); }
  }
  if (!any){ clearInterval(fxUi.tick); fxUi.tick = null; }
}
async function fxTry(k, quiet){
  const d = fxDraft(k);
  fxUi.err[k.id] = '';
  try {
    const r = await api('POST', '/api/knobs/try', {knob: k.id, effect: d.effect, params: d.params});
    if (r.ok){
      const s = r.json && isFinite(r.json.seconds) ? +r.json.seconds : r.json && isFinite(r.json.expires_in) ? +r.json.expires_in : FX_TRY_S;
      const was = fxUi.trying[k.id];
      fxUi.trying[k.id] = Date.now() + s * 1000;
      if (!fxUi.tick) fxUi.tick = setInterval(fxTickAll, 1000);
      if (!quiet || !was) rerender(); else fxTickAll();
      return;
    }
    fxUi.err[k.id] = r.status === 404 ? 'Trying it needs a newer version of the radio’s software. Update it in This radio → Updates.' : capFirst((r.json && r.json.error) || 'The radio couldn’t play it (error ' + r.status + ')') + '. Try again.';
  } catch (_) { fxUi.err[k.id] = NET_ERR; }
  rerender();
}
// Sound → the save bar: every knob with a draft in one go (as shipped is saved as "no override").
async function fxSaveAll(){
  const ks = fxDirtyKnobs(); if (!ks.length || fxUi.saving) return;
  const body = {};
  for (const k of ks){ const d = fxDraft(k); body[k.id] = fxSame(d, fxDefault(k)) ? null : {effect: d.effect, params: d.params}; }
  fxUi.saving = true; ks.forEach(k => { fxUi.err[k.id] = ''; }); paintSaveBar();
  try {
    const r = await api('PUT', '/api/knobs/functions', body);
    if (r.ok){
      adoptFx(r.json);
      for (const k of ks){ delete fxUi.draft[k.id]; delete fxUi.trying[k.id]; }
      toast(nameAnd(ks.map(k => { const nk = fxKnob(k.id) || k; return fxName(nk) + ' knob: ' + ((fxEffect(nk.effect) || {}).label || nk.effect).toLowerCase(); })) + ' — saved');
    } else { const m = capFirst((r.json && r.json.error) || 'The radio didn’t take that (error ' + r.status + ')') + '. Check it and save again.'; ks.forEach(k => { fxUi.err[k.id] = m; }); toast(m, true); }
  } catch (_) { toast(NET_ERR, true); }
  fxUi.saving = false;
  if (view === 'settings') rerender();
}
function fxDiscard(){ fxUi.draft = {}; fxUi.err = {}; fxEndTries(); }
// Stop every "Try it": the radio goes back to the saved effect at once.
function fxEndTries(){
  if (!Object.keys(fxUi.trying).length) return;
  fxUi.trying = {}; clearInterval(fxUi.tick); fxUi.tick = null;
  try { fetch('/api/knobs/try', {method:'DELETE', keepalive:true, cache:'no-store', headers:{'Content-Type':'application/json'}, body:'{}'}).catch(() => {}); } catch (_) {}
}
function fxStopAll(){ fxEndTries(); toast('Back to how it was'); if (view === 'settings') rerender(); }
function fxReset(k){
  fxUi.draft[k.id] = clone(fxDefault(k));
  if (fxSame(fxUi.draft[k.id], fxSaved(k))) delete fxUi.draft[k.id];
  fxUi.err[k.id] = ''; rerender();
  if (fxUi.trying[k.id]) fxTry(k, true);
}

/* the wizard: one capture per step, then fit, try, save */
const POT_STEPS = [
  [0,    'Fully down'],
  [1/8,  'One-eighth up',    'Turn it one-eighth of the way up'],
  [1/4,  'A quarter up',     'Turn it a quarter of the way up'],
  [3/8,  'Three-eighths up', 'Turn it three-eighths of the way up'],
  [1/2,  'Halfway',          'Turn it halfway up'],
  [3/4,  'Three-quarters up','Turn it three-quarters of the way up'],
  [1,    'Fully up'],
];
function wizSteps(k){
  if (isSel(k)){
    const ps = k.positions && k.positions.length ? k.positions : [1, 2, 3], n = ps.length;
    return ps.map((p, i) => {
      const nm = posName(p), num = String(i + 1);
      return {pos: n > 1 ? i / (n - 1) : 0, short: 'Position ' + num + (nm && nm !== num ? ' · ' + nm : ''),
        say: 'Turn the selector to position ' + num + (nm && nm !== num ? ' (' + nm + ')' : '')};
    });
  }
  const loud = /vol/i.test(k.id + ' ' + (k.label || ''));
  const lo = loud ? 'quietest' : 'minimum', hi = loud ? 'loudest' : 'maximum';
  return POT_STEPS.map(([pos, short, say]) => ({pos, short,
    say: pos === 0 ? 'Turn the knob fully down, to its ' + lo + ' end' : pos === 1 ? 'Turn it all the way up, to its ' + hi + ' end' : say}));
}
function openWizard(k){
  const steps = wizSteps(k);
  wiz = {k, steps, i: 0, pts: steps.map(() => null), phase:'step', fit:null, err:'', busy:false, saving:false};
  const dlg = $('dlg');
  dlg.onclick = null;   // no backdrop dismiss: the owner is turning a knob with the other hand
  dlg.oncancel = e => { if (!wizLeave()) e.preventDefault(); };
  dlg.onclose = () => { wiz = null; dlg.oncancel = null; dlg.onclose = null; if (view === 'settings') rerender(); };
  renderWiz();
  if (!dlg.open) dlg.showModal();
  knobPoll(true);
}
function wizLeave(){
  return !wiz || wiz.saving || !wiz.pts.some(Boolean) || confirm('Stop calibrating? The readings so far are thrown away and the knob keeps its current curve.');
}
function wizClose(){ if (wizLeave()) $('dlg').close(); }
function wizDirNote(k){
  return isSel(k)
    ? h('p', {class:'wz-note'}, 'Go through the positions in order. If the selector is wired the other way round, the radio works that out.')
    : h('p', {class:'wz-note'}, 'Each step turns further towards ', h('b', null, /vol/i.test(k.id + ' ' + (k.label || '')) ? 'louder' : 'more'),
        '. If the knob is wired backwards, the radio works that out — just follow the steps.');
}
function wizPoints(){
  const redo = (wiz.fit && wiz.fit.redo) || [];
  return h('ul', {class:'wz-pts', 'aria-label':'Captured points'}, wiz.steps.map((s, i) => {
    const p = wiz.pts[i], bad = redo.includes(i), cur = wiz.phase === 'step' && i === wiz.i;
    return h('li', {class: bad ? 'redo' : null, 'aria-current': cur ? 'true' : null},
      h('span', {class:'n'}, (i + 1) + '. ' + s.short + (bad ? ' — please redo' : '')),
      h('span', {class:'r'}, p ? 'raw ' + p.raw : cur ? 'now' : '—'),
      p ? h('button', {type:'button', class:'link' + (bad ? ' danger' : ' quiet'), 'aria-label':'Redo ' + s.short, onclick: () => { wiz.i = i; wiz.phase = 'step'; wiz.err = ''; renderWiz(); }}, 'redo')
        : h('span', {style:'width:52px'}));
  }));
}
function renderWiz(){
  const dlg = $('dlg'); if (!wiz) return;
  dlg.textContent = '';
  const k = wiz.k, name = k.label || k.id, n = wiz.steps.length;
  const body = h('div', {class:'wz'}), add = (...kids) => body.append(...kids.filter(Boolean));
  if (wiz.phase === 'step'){
    const s = wiz.steps[wiz.i];
    add(
      h('span', {class:'mono'}, 'Calibrate ' + name + ' · step ' + (wiz.i + 1) + ' of ' + n),
      h('h2', {id:'dlgTitle', class:'wz-say'}, s.say),
      wiz.i === 0 || wiz.err ? wizDirNote(k) : null,
      h('div', {class:'wz-live'}, dialSvg(k, wiz.steps, wiz.i),
        h('div', {class:'wz-read'}, h('span', {class:'mono'}, 'Reading'), h('span', {class:'wz-raw', id:'wzRaw'}, '—'),
          h('span', {class:'wz-stab', id:'wzStab', 'aria-live':'polite'}, 'Listening…'))),
      wiz.err ? h('p', {class:'err', role:'alert'}, wiz.err) : null,
      h('button', {type:'button', class:'btn primary big', id:'wzCap', disabled:true, onclick: wizCapture}, 'Capture'),

      h('div', {class:'acts'}, h('button', {type:'button', class:'btn small', onclick: wizClose}, 'Cancel')));
  } else if (wiz.phase === 'fit'){
    add(h('span', {class:'mono'}, 'Calibrate ' + name), h('h2', {id:'dlgTitle', class:'wz-say'}, 'Working out the curve…'),
      wiz.err ? h('p', {class:'err', role:'alert'}, wiz.err) : h('p', {class:'loading'}, h('span', {class:'spin'})),
      wiz.err ? h('div', {class:'acts'}, h('button', {type:'button', class:'btn small primary', onclick: wizFit}, 'Try again'),
        h('button', {type:'button', class:'btn small', onclick: wizClose}, 'Cancel')) : null,
      wiz.err ? wizPoints() : null);
  } else {
    const f = wiz.fit, warn = (f.warnings || []).filter(Boolean), redo = f.redo || [];
    add(
      h('span', {class:'mono'}, 'Calibrate ' + name + ' · try it'),
      h('h2', {id:'dlgTitle', class:'wz-say'}, 'Turn the knob and watch'),
      h('p', {class:'wz-note'}, 'The dot follows the new curve. Happy with it? Save. Nothing changes on the radio until you do.'),
      h('div', {class:'wz-try'}, h('span', {class:'mono'}, 'New curve'), h('b', {id:'wzVal'}, '—')),
      isSel(k) ? null : h('div', {class:'kn-bar'}, h('span', {class:'kn-fill', id:'wzFill'})),
      curveSvg(k, f.curve, {w:300, h:150, dot:'wzDot', pts: wiz.pts.map((p, i) => p && {raw:p.raw, pos:wiz.steps[i].pos}), redo}),
      h('p', {class:'kn-raw', id:'wzRawLine'}, '—'),
      warn.length || redo.length ? h('div', {class:'alert', role:'alert'},
        redo.length ? h('p', {style:'margin:0'}, redo.length === 1 ? 'One point looks off — redo the one marked in red.' : 'Some points look off — redo the ones marked in red.') : null,
        warn.length ? h('ul', null, warn.map(w => h('li', null, w))) : null) : null,
      wizPoints(),
      wiz.err ? h('p', {class:'err', role:'alert'}, wiz.err) : null,
      h('div', {class:'acts'},
        h('button', {type:'button', class:'btn primary', disabled: wiz.saving, onclick: wizSave}, wiz.saving ? 'Saving…' : 'Save'),
        h('button', {type:'button', class:'btn', disabled: wiz.saving, onclick: wizClose}, 'Cancel')));
  }
  dlg.append(body);

}
function paintWiz(){
  if (!wiz) return;
  const k = wiz.k, raw0 = knobUi.live[k.id], s = raw0 && !raw0.err ? raw0 : null;
  if (wiz.phase === 'step'){
    const raw = $('wzRaw'), st = $('wzStab'), cap = $('wzCap');
    if (raw) raw.textContent = s ? String(Math.round(s.raw)) : '—';
    if (st){
      const txt = raw0 && raw0.err === 404 ? KNOB_OLD : !s ? (raw0 ? 'No reading' : 'Listening…') : s.stable ? 'Steady — capture it' : 'Settling… hold still';
      if (st.textContent !== txt) st.textContent = txt;

async function wizCapture(){

  const w = wiz; w.busy = true; w.err = ''; paintWiz();

  try { const r = await api('GET', knobUrl(w.k.id, '/sample?n=15')); status = r.status; if (r.ok && r.json && isFinite(r.json.raw)) s = r.json; } catch (_) {}
  if (wiz !== w) return;
  w.busy = false;
  if (!s){ w.err = status === 404 ? KNOB_OLD : 'Couldn’t read the knob. Try again.'; renderWiz(); return; }
  if (!s.stable){ w.err = 'The reading moved while capturing — let go of the knob and try again.'; renderWiz(); return; }
  w.pts[w.i] = {raw: Math.round(s.raw)};
  if (w.fit && w.fit.redo) w.fit.redo = w.fit.redo.filter(j => j !== w.i);
  const next = w.pts.findIndex(p => !p);
  if (next >= 0){ w.i = next; renderWiz(); }

}
async function wizFit(){
  const w = wiz; if (!w) return;
  w.phase = 'fit'; w.err = ''; renderWiz();
  try {
    const r = await api('POST', knobUrl(w.k.id, '/fit'), {points: w.steps.map((s, i) => ({position: s.pos, raw: w.pts[i].raw})), direction:'auto'});
    if (wiz !== w) return;
    if (r.ok && r.json && Array.isArray(r.json.curve)){ w.fit = r.json; w.phase = 'review'; }
    else w.err = r.status === 404 ? KNOB_OLD : (r.json && (r.json.error || (r.json.warnings || []).join(' '))) || 'Couldn’t fit a curve (error ' + r.status + ').';
    if (r.ok && r.json && !Array.isArray(r.json.curve) && Array.isArray(r.json.redo) && r.json.redo.length){
      // No usable curve: send the owner straight back to the first point to redo.
      w.fit = {curve:[], warnings:r.json.warnings || [], redo:r.json.redo}; w.i = r.json.redo[0]; w.phase = 'step';
      w.err = (r.json.warnings || []).join(' ') || 'Some points need redoing.';
    }
  } catch (_) { if (wiz !== w) return; w.err = NET_ERR; }
  renderWiz();
}
async function wizSave(){
  const w = wiz; if (!w || !w.fit || w.saving) return;
  w.saving = true; w.err = ''; renderWiz();
  try {
    const r = await api('PUT', knobUrl(w.k.id, '/calibration'), {curve: w.fit.curve, direction: w.fit.direction, hysteresis_counts: w.fit.hysteresis_counts});

    }
    w.err = r.status === 404 ? KNOB_OLD : (r.json && r.json.error) || 'Couldn’t save (error ' + r.status + ').';
  } catch (_) { if (wiz !== w) return; w.err = NET_ERR; }
  w.saving = false; renderWiz();
}

}

/* ================= polling ================= */
let pollTimer = null, polling = false;
async function poll(){
  if (polling) return; polling = true;
  try {
    const r = await api('GET', '/api/status');
    if (r.ok && r.json){ status = r.json; online = true; } else online = false;
  } catch (_) { online = false; }
  polling = false;
  renderRemote();
}
// Every second while the front is on screen; slower behind Settings/Edit on a
// phone (the front isn't visible) and while the radio can't be reached.
const remoteShown = () => view === 'remote' || wide.matches;
function schedule(){
  clearTimeout(pollTimer); pollTimer = null;
  if (document.hidden) return;
  pollTimer = setTimeout(async () => { await poll(); schedule(); }, !online ? 3000 : remoteShown() ? 1000 : 4000);
}
function pollSoon(){ clearTimeout(pollTimer); pollTimer = setTimeout(async () => { await poll(); schedule(); }, 250); }
document.addEventListener('visibilitychange', () => { if (document.hidden){ clearTimeout(pollTimer); pollTimer = null; } else { poll().then(schedule); castSchedule(); refreshGroup().then(grpSchedule); } });

/* ================= boot ================= */
// Pick up changes made elsewhere (another phone, Browse) before editing.
async function refreshConfig(){
  try {
    const r = await api('GET', '/api/config');
    if (r.ok && r.json && Array.isArray(r.json.keys) && !isDirty() && JSON.stringify(r.json) !== JSON.stringify(cfg)){ adopt(r.json); buildBank(); if (view === 'edit') rerender(); }
  } catch (_) {}
}
async function loadConfig(){
  try {
    const r = await api('GET', '/api/config');
    if (!r.ok || !r.json || !Array.isArray(r.json.keys)) throw new Error('bad');
    adopt(r.json);
  } catch (_) { cfg = cfg || undefined; }
  buildBank(); renderRemote(); paintMr();
  if (view === 'edit'){ onRoute(); }
}
window.addEventListener('beforeunload', e => { const pg = SET_PAGE[curPage()]; if (isDirty() || (pg && pg.dirty && pg.dirty())){ e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 's' && view === 'edit'){ e.preventDefault(); save(); } });

paintKnob();
onRoute();
poll().then(schedule);
loadConfig();
loadAccount();
loadSoftware();
loadSettings().then(() => { if (view === 'settings') rerender(); if (settings && settings.volume_limit != null){ K.limit = +settings.volume_limit; paintKnob(); } });
refreshHa();
loadGroup().then(() => { paintGroup(); watchGroup(); grpSchedule(); if (view === 'settings' && grp && !grp.missing) rerender(); });
})();
</script>
