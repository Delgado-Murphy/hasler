html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--cream);font:15px/1.4 var(--sans);min-height:100vh;min-height:100dvh;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;font-size:10px;line-height:14px;color:var(--muted)}

/* ---------- shell ---------- */
.app{max-width:440px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
.app[data-view="remote"] #panel{display:none}
.app:not([data-view="remote"]) #remote{display:none}
@media (min-width:960px){
  .app{max-width:1220px;display:grid;grid-template-columns:420px minmax(0,1fr);gap:48px;align-items:start;padding-top:24px}
  .app #remote,.app[data-view="remote"] #panel{display:flex}
  .app:not([data-view="remote"]) #remote{display:flex}
  #remote{position:sticky;top:24px}
  #panel{min-height:calc(100vh - 48px)}
  .panel-remote-only{display:none !important}
}
.remote{display:flex;flex-direction:column;gap:18px}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0;min-height:calc(100vh - 34px);min-height:calc(100dvh - 34px - env(safe-area-inset-top))}
.panel > .sheet{flex:1 0 auto}

/* ---------- top bars ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.brand{margin:0;color:var(--brass);font:italic 600 22px/26px var(--serif);letter-spacing:.01em}
.top-btns{display:flex;align-items:center;gap:2px}
.round{position:relative;width:44px;height:44px;border:0;background:none;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;color:var(--brass)}
.round::before{content:"";position:absolute;inset:4px;border:1px solid var(--line);border-radius:50%;transition:border-color .15s,background .15s}
.round:hover::before{border-color:var(--line2);background:rgba(201,161,90,.06)}
.round svg{position:relative;display:block}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 6px;border:0;background:none;color:var(--brass);font:600 13px/1 var(--sans);position:relative}
.pill::before{content:"";position:absolute;inset:4px 0;border:1px solid var(--line);border-radius:18px;transition:border-color .15s}
.pill:hover::before{border-color:var(--line2)}
.pill > *{position:relative}
.pill{padding:0 14px 0 12px}
.title-row{display:flex;align-items:center;gap:6px;min-height:44px}
.title-row h1,.title-row h2.brand{margin:0}
.btn-done{min-height:36px;padding:9px 16px;border:0;border-radius:18px;background:var(--amber);color:#1A1208;font:800 14px/18px var(--sans)}
.btn-done:hover{filter:brightness(1.06)}

/* ---------- dial (13d) ---------- */
.bezel{padding:6px;border-radius:16px;background:linear-gradient(180deg,#D8D2C6 0%,#8E877B 50%,#C9C2B5 100%);box-shadow:0 2px 0 #000,0 8px 18px rgba(0,0,0,.5)}
.glass{position:relative;display:flex;flex-direction:column;gap:12px;padding:16px 18px 12px;border-radius:11px;min-width:0;
  background:radial-gradient(circle farthest-corner at 50% 35%,#FBF0D4 0%,#EFDAA8 62%,#D6BA7E 100%);transition:filter .6s ease}
.glass.off{filter:brightness(.72) saturate(.55)}
.glass.offline{filter:brightness(.6) saturate(.3)}
.dial-head{display:flex;justify-content:space-between;gap:10px;color:#7A5E38;font:9.5px/13px var(--mono);letter-spacing:.18em;text-transform:uppercase}
.dial-head span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dial-head span:last-child{flex:none}
.dial-name{margin:0;color:#1E1308;font:600 34px/38px var(--serif);letter-spacing:-.01em;overflow-wrap:break-word;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.dial-name.long{font-size:25px;line-height:29px}
.song{display:flex;align-items:center;gap:10px;min-width:0;min-height:34px}
.cover{position:relative;flex:none;width:34px;height:34px;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px rgba(60,40,20,.25);
  background:linear-gradient(135deg,#9C4A2E 0%,#C8643C 55%,#E3B98A 100%)}
.cover.radio{background:linear-gradient(160deg,#F6EBD0,#DCC594);display:flex;align-items:center;justify-content:center}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.song-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.song-title{color:#2E1F10;font:600 14px/18px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-sub{color:#7A5E38;font:12px/16px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scale{position:relative;height:50px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%)}
.strip{position:absolute;top:0;left:0;height:50px;will-change:transform;transition:transform .42s cubic-bezier(.3,.7,.3,1);
  background:linear-gradient(rgba(59,42,24,.7),rgba(59,42,24,.7)) 0 12px/100% 1px no-repeat,
    repeating-linear-gradient(90deg,rgba(59,42,24,.7) 0 1px,transparent 1px var(--minor,27.5px)) 0 8px/100% 8px no-repeat}
.strip.still{transition:none}
.st{position:absolute;top:0;width:var(--sp,110px);margin-left:calc(var(--sp,110px) / -2);text-align:center}
.st::before{content:"";position:absolute;left:calc(50% - .5px);top:5px;width:1px;height:14px;background:rgba(59,42,24,.7)}
.st-n{position:absolute;top:21px;left:0;right:0;font:8.5px/10px var(--mono);color:#7A5E38}
.st-nm{position:absolute;top:34px;left:6px;right:6px;font:11.5px/14px var(--serif);color:#5A4428;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.on .st-n{font-weight:700;color:#2E1F10}
.st.on .st-nm{font-weight:700;font-size:12.5px;color:#1E1308}
.needle{position:absolute;left:calc(50% - 1.5px);top:0;width:3px;height:21px;border-radius:1.5px;background:var(--needle);box-shadow:0 0 0 .5px rgba(120,30,10,.2)}
.dial-wrap{position:relative}

/* ---------- key bank ---------- */
.bank{display:flex;gap:6px;padding:10px 10px 17px;border-radius:14px;border-top:3px solid #8C6A3A;
  background:linear-gradient(180deg,#25190F 0%,#1D140C 100%);box-shadow:inset 0 2px 0 rgba(0,0,0,.5)}
.key{position:relative;flex:1 1 0;min-width:0;height:176px;padding:14px 2px 12px;border:0;border-radius:6px 6px 9px 9px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;color:var(--ink);text-align:center;
  background:linear-gradient(180deg,#F3EAD5 0%,#E2D5B8 82%,#C9B994 100%);
  box-shadow:0 5px 0 #8F7F5E,0 6px 10px rgba(0,0,0,.5);
  transition:transform .07s ease,box-shadow .1s ease,background .1s ease;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.key-n{font:900 24px/26px var(--sans);letter-spacing:-.02em}
.key-l{color:#6B5A40;font:9px/11px var(--mono);letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;max-width:100%}
.key.pu{flex-grow:1.15;margin-left:6px;color:var(--cream);background:linear-gradient(180deg,#4B3827 0%,#35271B 85%,#2A1E14 100%);box-shadow:0 5px 0 #1C130C,0 6px 10px rgba(0,0,0,.5)}
.key.pu .key-n{font-size:20px}
.key.pu .key-l{color:var(--brass)}
.key.down{transform:translateY(5px);background:linear-gradient(180deg,#FAF2DF 0%,#E8DCC0 82%,#D0C19E 100%);
  box-shadow:inset 0 3px 0 var(--amber),0 0 0 #8F7F5E,0 0 18px rgba(255,178,56,.55)}
.key.pu.down{background:linear-gradient(180deg,#5A4430 0%,#40301F 85%,#33261A 100%);box-shadow:inset 0 3px 0 var(--amber),0 0 0 #1C130C,0 0 18px rgba(255,178,56,.45)}
.key:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
@media (max-width:379px){ .key{height:164px} .key-l{font-size:8px;line-height:10px;letter-spacing:.02em} .key-n{font-size:21px} .bank{gap:5px;padding-inline:8px} }

/* ---------- controls ---------- */
.controls{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 0}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px}
.ctl-btn{width:54px;height:54px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle farthest-corner at 50% 35%,#2E2117 0%,#1F150E 100%);color:var(--brass);transition:box-shadow .2s,border-color .2s}
.ctl-btn:hover{border-color:#7A5A36}
.ctl-btn:active{transform:translateY(1px)}
.ctl-btn[aria-pressed="true"]{border-color:var(--amber);box-shadow:0 0 14px rgba(255,178,56,.35)}
.ctl-lbl{color:var(--muted);font:9.5px/12px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.knob{display:block;touch-action:none;cursor:grab;border-radius:50%}
.knob:active{cursor:grabbing}
.knob:focus-visible{outline:2px solid var(--amber);outline-offset:-6px}
.vol-lbl{color:var(--brass);font:9.5px/12px var(--mono);letter-spacing:.14em;font-variant-numeric:tabular-nums}
.tone{display:flex;align-items:center;gap:10px;margin:14px 14px 0;color:var(--muted);font:9.5px/12px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.tone[hidden]{display:none}
.tone-bar{position:relative;flex:1;height:4px;border-radius:2px;background:linear-gradient(90deg,#6B4A2A,#3A2A1C 50%,#E8CA8A)}
.tone-mid{position:absolute;left:50%;top:-3px;width:1px;height:10px;background:#5A4128}
.tone-dot{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#F0D59A,#9A7638);box-shadow:0 0 6px rgba(255,178,56,.35);transition:left .25s}
.tone-db{min-width:5.5em;text-align:right;color:var(--brass);font-variant-numeric:tabular-nums}
.tone-off{color:#D9442B}
.foot{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:8px}
.hint-line{margin:0;color:var(--muted);font:12px/16px var(--sans);text-align:center}

/* ---------- maker's mark ---------- */
.mark{display:flex;align-items:center;justify-content:center;gap:10px;margin:0;color:#7D766B;
  font:600 10px/12px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.28em;text-transform:uppercase}
.mark::before{content:"";flex:0 0 20px;height:1px;background:#2E2218}
.mark .amp{font:italic 400 10px/12px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;letter-spacing:0;text-transform:none;color:#5A544B}

/* ---------- edit keys ---------- */
.strip-keys{display:flex;gap:5px;padding:8px;border-radius:12px;border-top:2px solid #8C6A3A;background:#1F140D}
.skey{position:relative;flex:1 1 0;min-width:0;height:58px;border:0;border-radius:5px;background:#E8DCC2;color:var(--ink);font:900 17px/22px var(--sans);
  display:flex;align-items:center;justify-content:center;transition:background .12s,box-shadow .12s}
.skey.pu{flex-grow:1.15;margin-left:5px;background:#4A3726;color:var(--cream);font-size:14px}
.skey[aria-current="true"]{background:#FFF3D9;box-shadow:0 0 0 2px var(--amber),0 0 14px rgba(255,178,56,.5)}
.skey.pu[aria-current="true"]{background:#6A5038}
.skey .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.skey .dot.dirty{background:var(--amber)}
.sheet{position:relative;display:flex;flex-direction:column;gap:16px;margin:0 -16px;padding:18px 18px 0;border-top:1px solid var(--line2);border-radius:22px 22px 0 0;
  background:linear-gradient(180deg,#261A11 0%,#1F150D 100%);min-height:60vh}
.grab{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line2);flex:none}
.sheet-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sheet-head h2{margin:0;color:var(--title);font:600 28px/32px var(--serif)}
@media (min-width:960px){
  .sheet{margin:0;border:1px solid var(--line2);border-radius:22px;min-height:0;padding-bottom:0}
}
.seg{display:flex;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--well)}
.seg button{flex:1 1 0;min-width:0;min-height:38px;padding:8px 4px;border:0;border-radius:7px;background:none;color:var(--muted);font:700 13px/16px var(--sans)}
.seg button[aria-checked="true"]{background:var(--cream);color:#1E140C;font-weight:800}
.seg button:hover:not([aria-checked="true"]){color:var(--cream)}
.choice{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid rgba(255,178,56,.33);border-radius:12px;background:var(--well);min-width:0}
.choice.unset{border-style:dashed;border-color:var(--line2)}
.thumb{position:relative;flex:none;width:46px;height:46px;border-radius:6px;overflow:hidden;background:linear-gradient(135deg,#3E4A57,#AEB8C2)}
.thumb.radio,.thumb.blank{background:linear-gradient(160deg,#F3EAD5,#D5C298);display:flex;align-items:center;justify-content:center}
.thumb.blank{background:#2A1D13}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb.sm{width:40px;height:40px;border-radius:5px}
.choice-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.choice-name{color:var(--title);font:600 16px/20px var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.choice-type{color:var(--muted);font:10px/13px var(--mono);letter-spacing:.08em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.choice input{min-height:36px;padding:6px 8px}
.link{background:none;border:0;padding:10px 2px;min-height:44px;color:var(--brass);font:600 13px/16px var(--sans);text-decoration:underline 1px;text-underline-offset:3px;flex:none}
.link:hover{color:#E0BC78}
.link.quiet{color:var(--muted);font-weight:500}
.link.danger{color:var(--red)}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none}
.searchbox input[type]{padding-left:40px}
input[type=text],input[type=search],input[type=url],input[type=password],input[type=number],textarea{width:100%;min-height:46px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--well);color:var(--cream);font:15px/20px var(--sans);-webkit-appearance:none;appearance:none}
input::-webkit-search-cancel-button{-webkit-appearance:none}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:1px;border-color:transparent}
input::placeholder,textarea::placeholder{color:#6E5C45}
textarea{min-height:120px;resize:vertical;font:13px/1.45 var(--mono)}
[aria-invalid="true"]{border-color:var(--red) !important}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:34px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--muted);font:700 13px/1 var(--sans)}
.chip[aria-checked="true"]{background:var(--cream);border-color:var(--cream);color:#1E140C}
.chip:hover:not([aria-checked="true"]){border-color:var(--line2);color:var(--cream)}
.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.res{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:8px;min-width:0;cursor:pointer}
.res:hover,.res[aria-selected="true"]{background:#2A1D13}
.res.picked{box-shadow:inset 2px 0 0 var(--amber)}
.res-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.res-title{color:var(--cream);font:600 14px/18px var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-sub{color:var(--muted);font:9.5px/12px var(--mono);letter-spacing:.06em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-play{flex:none;width:44px;height:44px;border:0;background:none;padding:0;position:relative;display:flex;align-items:center;justify-content:center;color:var(--brass)}
.res-play::before{content:"";position:absolute;inset:5px;border:1px solid var(--line2);border-radius:50%}
.res-play:hover::before{border-color:var(--amber)}
.res-play svg{position:relative}
.res-play[disabled]{opacity:.5}
.stat{margin:0;color:var(--muted);font-size:13px}
.stat:empty{display:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;border-top:1px solid var(--line);min-width:0}
.row-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.row-val{color:var(--cream);font:600 15px/20px var(--sans);overflow-wrap:anywhere}
.row-val small{color:var(--muted);font-weight:400;font-size:13px}
.picker{list-style:none;margin:0;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--well);display:flex;flex-direction:column}
.picker button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 10px;border:0;border-radius:8px;background:none;text-align:left;color:var(--cream);font:600 14px/18px var(--sans)}
.picker button small{display:block;color:var(--muted);font-weight:400;font-size:12px;line-height:16px}
.picker button:hover{background:#2A1D13}
.picker button[aria-checked="true"]{background:#33241A;box-shadow:inset 2px 0 0 var(--amber)}
.picker .grp{padding:10px 10px 4px;color:var(--muted);font:10px/14px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.picker .radio-dot{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line2)}
.picker button[aria-checked="true"] .radio-dot{border-color:var(--amber);background:radial-gradient(circle,var(--amber) 0 4px,transparent 4.5px)}
.field{display:flex;flex-direction:column;gap:6px}
.field > label{color:var(--muted);font:10px/14px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.hint{margin:0;color:var(--muted);font-size:13px;line-height:18px}
.err{margin:0;color:#F07A62;font:600 13.5px/18px var(--sans)}
.err::before{content:"▲ ";font-size:9px;vertical-align:1px}
.err:empty{display:none}
.note-bad{margin:0;color:#F07A62;font:12.5px/16px var(--sans)}
.alert{padding:12px 14px;border:1px solid rgba(217,68,43,.5);background:rgba(217,68,43,.08);color:#F3C0B4;border-radius:12px;font-size:14px}
.alert ul{margin:6px 0 0;padding-left:18px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;margin:0;border-radius:999px;background:var(--well);border:1px solid var(--line2);position:relative;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch input:checked{background:#5A4128}
.switch input:checked::after{transform:translateX(18px);background:var(--amber)}
.actions{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;margin:auto -18px 0;padding:14px 18px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(31,21,13,0),#1F150D 22%)}
.btn{flex:1 1 0;min-height:48px;padding:12px 14px;border:1px solid var(--line2);border-radius:12px;background:none;color:var(--brass);font:700 15px/20px var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover:not(:disabled){border-color:#7A5A36}
.btn.primary{border:0;background:var(--amber);color:#1A1208;font-weight:800;box-shadow:0 0 18px rgba(255,178,56,.3)}
.btn.primary:hover:not(:disabled){filter:brightness(1.05)}
.btn:disabled{opacity:.55;cursor:default}
.btn.small{flex:none;min-height:44px;padding:10px 18px;border-radius:10px;font-size:14px}
.btn.inline{flex:none}
.save-msg{margin:-6px 0 0;font-size:13px;color:var(--muted);text-align:center}
.save-msg.bad{color:#F07A62;font-weight:600}
.save-msg:empty{display:none}
.keylist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.keylist button{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:8px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.keylist button:hover{background:rgba(201,161,90,.05)}
.kl-n{flex:none;width:36px;height:40px;border-radius:4px 4px 6px 6px;background:#E8DCC2;color:var(--ink);font:900 16px/40px var(--sans);text-align:center}

// RD… lists are endless radio mixes; RDCLAK5uy_… are YouTube Music's own (finite) playlists.
const isRadioUri = u => /[?&]list=RD(?!CLAK)/i.test(u || '');

function domainVerb(domain){

function entityById(id){ return haEnts && haEnts.entities.find(e => e.entity_id === id); }

/* ================= config draft ================= */
function normAct(a){

}
function refCount(d, n){
  let c = 0;
  for (const k of d.keys) for (const s of ['tap','hold']) if (k[s] && k[s].do === 'preset' && k[s].n === n) c++;

}
function payload(d){

    presets: d.presets
      .filter(p => refCount(d, p.n) || (p.uri || '').trim())
      .map(p => ({n:p.n, name:(p.name || '').trim(), source:p.source, uri:(p.uri || '').trim(),
        shuffle: p.source === 'radio' || isRadioUri(p.uri) ? false : !!p.shuffle})),

}
function keySig(d, k){

    .map(p => p ? {name:(p.name || '').trim(), source:p.source, uri:(p.uri || '').trim(), shuffle:!!p.shuffle} : null);
  return JSON.stringify([normAct(k.tap), normAct(k.hold), ps]);
}
const isDirty = () => !!draft && JSON.stringify(payload(draft)) !== baseline;
const keyDirty = k => !!draft && baseSig[k.id] !== keySig(draft, k);
function adopt(newCfg){
  cfg = newCfg;

  baseSig = {};
  for (const k of draft.keys) baseSig[k.id] = keySig(draft, k);
}
const nextFreeN = d => d.presets.reduce((m, p) => Math.max(m, +p.n || 0), 0) + 1;

function presetIssues(p){
  const out = {}, uri = (p.uri || '').trim();
  if (!uri) out.uri = p.source === 'radio' ? 'Pick a station or paste a stream link.' : p.source === 'ytm' ? 'Choose something from the search.' : 'Paste a link.';
  else if (p.source === 'radio' && !/^https?:\/\/\S+$/i.test(uri)) out.uri = 'Pick a station from the list, or paste a link starting with http:// or https://';
  else if (p.source === 'spotify' && !/^spotify:(playlist|album|track|artist|show|episode):\S+$/i.test(uri) && !/^https?:\/\/open\.spotify\.com\/\S+/i.test(uri))
    out.uri = 'That doesn’t look like a Spotify link. Use Share → Copy link in Spotify.';
  else if (p.source === 'ytm' && !/^https?:\/\/(music\.|www\.|m\.)?youtube\.com\/\S*[?&]list=/i.test(uri) && !/^https?:\/\/youtu\.be\/\S*[?&]list=/i.test(uri))
    out.uri = 'Use a playlist or album link — it contains “list=”.';
  if (!(p.name || '').trim()) out.name = 'Give it a name.';
  return out;
}
function applyServerErrors(list){
  errs = {}; hints = {}; general = [];
  for (const e of list || []){
    const where = String(e.where || ''), msg = e.message || 'Not valid.';
    let m;
    if ((m = /^presets\[(\d+)\](?:\.(\w+))?/.exec(where))){
      const p = lastSent && lastSent.presets[+m[1]];
      if (p){
        const f = ['name','source','uri','shuffle'].includes(m[2]) ? m[2] : '_';
        const kk = 'p' + p.n + '.' + f; errs[kk] = errs[kk] ? errs[kk] + ' ' + msg : msg;
        if (!refCount(draft, p.n)) general.push('Preset “' + (p.name || p.n) + '”: ' + msg);
        continue;
      }
    } else if ((m = /^keys\[(\d+)\](?:\.(tap|hold))?/.exec(where))){
      const k = lastSent && lastSent.keys[+m[1]];
      if (k){ const kk = k.id + '.' + (m[2] || '_'); errs[kk] = errs[kk] ? errs[kk] + ' ' + msg : msg; continue; }
    }
    general.push(where ? where + ': ' + msg : msg);
  }
}
function keyErrCount(k){
  let c = 0;
  for (const s of ['tap','hold','_']) if (errs[k.id + '.' + s]) c++;
  for (const s of ['tap','hold']){
    const a = k[s];
    if (a && a.do === 'preset') for (const f of ['name','source','uri','shuffle','_']) if (errs['p' + a.n + '.' + f]) c++;

}
const errText = key => errs[key] || hints[key] || '';
function clearErr(...keys){ for (const k of keys){ delete errs[k]; delete hints[k]; } }

/* ================= key names ================= */
function shortLabel(name){
  let s = String(name || '').split(':')[0].replace(/[()"“”]/g, '').trim();
  let w = s.split(/\s+/).filter(Boolean);
  const stop = new Set(['the','el','la','los','las','de','del','y','&','and','rne']);
  let f = w.filter(x => !stop.has(x.toLowerCase()));
  if (f.length > 2) f = f.filter(x => !/^(radio|fm)$/i.test(x));
  if (!f.length) f = w;
  if (f.length > 2) f = f.slice(-1);
  return f.map(x => x.length > 6 ? x.slice(0, 5) + '.' : x).join(' ') || '—';
}
function tapName(k){
  const a = k.tap, v = verbOf(a);
  if (v === 'preset'){ const p = presetIn(cfg, a.n); return p ? (p.name || '').trim() : ''; }
  if (isHa(v)){
    if (missingFor(k.id, 'tap')) return '—';
    const e = entityById(a.entity); return e ? e.name : verbShort(v);
  }
  if (v === 'none') return '—';
  if (v === 'cycle_source') return 'Source';
  return verbShort(v);
}
function keyName(k){
  // Full name for the dial / aria; the bank shows shortLabel() of it.
  const sk = status && status.keys && status.keys.find(x => x.id === k.id);
  const fromCfg = cfg ? tapName(k) : '';
  if (fromCfg === '—') return '—';
  return fromCfg || (sk && sk.name) || '';
}

/* ================= remote: key bank ================= */
const localDown = new Set();
const flashUntil = {};
let optimistic = null;     // {key, until}
let lastKey = null;
function remoteKeys(){
  if (cfg) return cfg.keys;
  if (status && status.keys) return status.keys.map(k => ({id:k.id, label:k.label}));
  return [];
}
function buildBank(){
  const bank = $('bank'); bank.textContent = '';
  for (const k of remoteKeys()){
    const btn = h('button', {type:'button', class:'key' + (k.id === 'pu' ? ' pu' : ''), 'data-key':k.id},
      h('span', {class:'key-n', 'aria-hidden':'true'}, k.label), h('span', {class:'key-l', 'aria-hidden':'true', lang:'es'}));
    bindKey(btn, k.id);
    bank.append(btn);
  }
  paintBank();
}
function holdVerb(id){ const k = cfg && cfg.keys.find(x => x.id === id); return verbOf(k && k.hold); }
function bindKey(btn, id){
  let timer = null, rep = null, held = false, active = false;
  btn.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    active = true; held = false;
    try { btn.setPointerCapture(e.pointerId); } catch (_) {}
    localDown.add(id); paintBank();
    timer = setTimeout(() => {
      held = true;
      const v = holdVerb(id), k = cfg && cfg.keys.find(x => x.id === id);
      if (navigator.vibrate) try { navigator.vibrate(15); } catch (_) {}
      toast('Held ' + (k ? keyLabel(k).replace(/^Key/, 'key') : id) + ' · ' + (v === 'none' ? 'does nothing' : holdName(k)));
      press(id, 'hold');
      if (v === 'volume_up' || v === 'volume_down') rep = setInterval(() => press(id, 'hold', true), 150);
    }, 600);
  });
  const end = fire => {
    if (!active) return;
    active = false; clearTimeout(timer); clearInterval(rep); rep = null;
    localDown.delete(id);
    if (fire && !held) tap(id);
    paintBank();
  };
  btn.addEventListener('pointerup', () => end(true));
  btn.addEventListener('pointercancel', () => end(false));
  btn.addEventListener('lostpointercapture', () => end(false));
  btn.addEventListener('contextmenu', e => e.preventDefault());
  btn.addEventListener('click', e => { if (e.detail === 0) tap(id); });   // keyboard: Enter / Space
}
function holdName(k){
  if (!k) return '';
  const v = verbOf(k.hold);
  if (isHa(v)){ const e = entityById(k.hold.entity); return verbShort(v) + (e ? ' ' + e.name : ''); }
  if (v === 'preset'){ const p = presetIn(cfg, k.hold.n); return p ? p.name : 'Play music'; }
  return verbShort(v);
}
function tap(id){
  flashUntil[id] = Date.now() + 260;
  const k = cfg && cfg.keys.find(x => x.id === id);
  if (k && k.tap && k.tap.do === 'preset') optimistic = {key:id, until: Date.now() + 3500};
  paintBank(); renderDial();
  setTimeout(paintBank, 280);
  press(id, 'tap');
}
async function press(id, event, quiet){
  try {
    const r = await api('POST', '/api/press', {key:id, event});
    if (!r.ok && !quiet) toast((r.json && r.json.error) || 'The radio didn’t take that press.', true);
  } catch (_) { if (!quiet) toast('Couldn’t reach the radio.', true); }
  if (!quiet) pollSoon();
}
function currentKey(){
  if (optimistic && Date.now() < optimistic.until){
    if (status && status.current_key === optimistic.key) optimistic = null;
    else return optimistic.key;
  }
  optimistic = null;
  if (!status || status.standby) return null;
  if (status.current_key) return status.current_key;
  if (status.playing && status.playing.n != null && cfg){
    const k = cfg.keys.find(k => k.id !== 'pu' && k.tap && k.tap.do === 'preset' && k.tap.n === status.playing.n);
    if (k) return k.id;
  }
  return null;
}
const RENDERERS = ['bluetooth','airplay'];
function puEngaged(){ return !!(status && !status.standby && !status.playing && (RENDERERS.includes(status.source) || (status.source === 'spotify' && status.renderer))); }
function paintBank(){
  const cur = currentKey(), pressed = new Set((status && status.pressed) || []), now = Date.now();
  for (const btn of $('bank').children){
    const id = btn.dataset.key;
    const k = remoteKeys().find(x => x.id === id) || {id, label:id};
    const name = keyName(k);
    const lbl = btn.querySelector('.key-l');
    const short = id === 'pu' && !cfg ? 'Source' : shortLabel(name);
    if (lbl.textContent !== short) lbl.textContent = short;
    const down = localDown.has(id) || (flashUntil[id] || 0) > now || pressed.has(id) || cur === id || (id === 'pu' && puEngaged());
    btn.classList.toggle('down', down);
    btn.setAttribute('aria-label', (k.label ? (id === 'pu' ? 'PU' : 'Key ' + k.label) : id) + (name && name !== '—' ? ': ' + name : '') + (cur === id ? ', playing' : ''));
    btn.setAttribute('aria-pressed', String(cur === id));
  }

/* ================= remote: dial ================= */
let stripSig = '', stripX = null, dialNameText = '', dialNameW = 0, lastLive = '';
function stations(){
  const out = [];
  for (const k of remoteKeys()){
    if (k.id === 'pu') continue;
    let name = '';
    if (cfg){ if (k.tap && k.tap.do === 'preset'){ const p = presetIn(cfg, k.tap.n); name = p ? p.name : ''; } else continue; }
    else { const sk = status.keys.find(x => x.id === k.id); if (!sk || sk.n == null) continue; name = sk.name; }
    out.push({id:k.id, label:k.label, name: name || 'Key ' + k.label});
  }
  return out;
}
function renderScale(curId){
  const scale = $('scale'), strip = $('stripEl');
  const cw = scale.clientWidth;
  if (!cw) return;
  const st = stations();
  const sp = Math.max(92, Math.min(124, cw / 3));
  const pad = sp * 6;
  const sig = cw + '|' + st.map(s => s.id + s.name).join('|');
  if (sig !== stripSig){
    stripSig = sig;
    strip.textContent = '';
    strip.style.setProperty('--sp', sp + 'px');
    strip.style.setProperty('--minor', (sp / 4) + 'px');
    strip.style.width = (pad * 2 + Math.max(0, st.length - 1) * sp) + 'px';
    st.forEach((s, i) => strip.append(h('div', {class:'st', 'data-id':s.id, style:'left:' + (pad + i * sp) + 'px'},
      h('span', {class:'st-n'}, s.label), h('span', {class:'st-nm'}, s.name))));
    strip.classList.add('still'); stripX = null;
  }
  const id = curId || lastKey || (st.length ? st[st.length - 1].id : null);
  let i = st.findIndex(s => s.id === id);
  if (i < 0) i = st.length - 1;
  for (const el of strip.children) el.classList.toggle('on', !!curId && el.dataset.id === curId);
  const x = Math.round(cw / 2 - (pad + Math.max(0, i) * sp));
  if (x !== stripX){
    strip.style.transform = 'translateX(' + x + 'px)';
    if (stripX === null) requestAnimationFrame(() => requestAnimationFrame(() => strip.classList.remove('still')));
    stripX = x;
  }
}
function setDialName(text){
  const el = $('dialName');
  const w = el.clientWidth;
  if (text === dialNameText && w === dialNameW) return;
  dialNameText = text; dialNameW = w;
  el.textContent = text;
  el.classList.remove('long');
  if (el.scrollHeight > 42) el.classList.add('long');
}
let coverSrc = null;
function setSong(title, sub, thumb, kind){
  const song = $('song');
  song.hidden = !title && !sub;
  $('songTitle').textContent = title || '';
  $('songTitle').hidden = !title;
  $('songSub').textContent = sub || '';
  const c = $('cover');
  const want = (kind || '') + '|' + (thumb || '');
  if (want !== coverSrc){
    coverSrc = want;
    c.textContent = '';
    c.className = 'cover' + (thumb ? '' : ' radio');
    c.hidden = kind === 'none';
    if (thumb) imgInto(c, thumb);
    else c.append(kind === 'bt' ? IC.dots() : kind === 'radio' ? IC.radio('#7A5E38', 20) : IC.note('#7A5E38'));
  }
}
function renderDial(){
  const glass = $('glass');
  const cur = currentKey();
  if (cur) lastKey = cur;
  glass.classList.toggle('off', !!(status && status.standby));
  glass.classList.toggle('offline', !online);
  let head = '', name = '', live = '';
  if (!online){
    head = 'No connection'; name = 'Can’t reach the radio'; setSong('Check you’re on the same Wi-Fi', '', '', 'none');
  } else if (!status){
    head = 'Tuning…'; name = 'Hasler'; setSong('', '', '', 'none');
  } else if (status.standby){
    head = 'Standby'; name = 'Standby'; setSong('', 'Tap any key to wake the radio', '', 'none');
  } else if (cur && (!status.playing || status.current_key !== cur) && optimistic){
    const k = cfg.keys.find(x => x.id === cur), p = presetIn(cfg, k.tap.n);
    head = keyLabel(k) + ' · ' + (SRC_HEAD[p && p.source] || ''); name = p ? p.name : keyLabel(k);
    setSong('Tuning in…', '', '', p && p.source === 'radio' ? 'radio' : 'note');
  } else if (status.playing){
    const pl = status.playing, k = cur && remoteKeys().find(x => x.id === cur);
    head = (k ? keyLabel(k) : 'Playing') + ' · ' + (SRC_HEAD[pl.source] || pl.source || '');
    name = pl.name || 'Playing';
    const t = status.track;
    if (pl.source === 'radio') setSong(t && t.title ? t.title : pl.name, t && t.artist ? t.artist : 'Live', t && t.thumb, 'radio');
    else setSong(t && t.title ? t.title : '', t ? t.artist || t.album || '' : (pl.source === 'spotify' ? 'Spotify' : ''), t && t.thumb, 'note');
    live = 'Now playing ' + name;
  } else if (RENDERERS.includes(status.source) || (status.source === 'spotify')){
    const nm = SRC_HEAD[status.source] || status.source, r = status.renderer || {};
    head = 'PU · ' + nm; name = status.source === 'spotify' ? 'Spotify Connect' : nm;
    if (status.waiting || (!r.title && !r.device)) setSong('Waiting for a phone', status.source === 'bluetooth' ? 'Pair it with “Hasler”' : 'Choose “Hasler” on your phone', '', 'bt');
    else setSong(r.title || r.device, [r.artist, r.title ? r.device : ''].filter(Boolean).join(' · '), '', 'bt');
    live = name;
  } else {
    head = 'Ready'; name = 'Quiet'; setSong('', 'Tap a key to play', '', 'none');
  }
  $('dialHead').textContent = head;
  setDialName(name);
  renderScale(status && !status.standby && status.playing ? cur : (optimistic ? cur : null));
  if (live !== lastLive){ lastLive = live; if (live) $('nowLive').textContent = live; }
}
new ResizeObserver(() => { renderDial(); }).observe($('scale'));

/* ================= remote: volume knob ================= */
const K = {v:0, limit:100, drag:false, lastUser:0, ang:0, timer:null, sent:null};
const ang = v => -135 + 270 * v / 100;
function pt(r, a){ const t = a * Math.PI / 180; return [(66 + r * Math.sin(t)).toFixed(2), (66 - r * Math.cos(t)).toFixed(2)]; }
function arcPath(r, a0, a1){ const [x0, y0] = pt(r, a0), [x1, y1] = pt(r, a1); return 'M' + x0 + ' ' + y0 + 'A' + r + ' ' + r + ' 0 ' + (a1 - a0 > 180 ? 1 : 0) + ' 1 ' + x1 + ' ' + y1; }
function paintKnob(){
  $('kTrack').setAttribute('d', arcPath(46, -135, 135));
  $('kArc').setAttribute('d', K.v > 0 ? arcPath(46, -135, ang(K.v)) : '');
  $('kCeil').setAttribute('d', '');   // the ceiling lives in the player: knob 100 = volume_limit
  $('kPtr').setAttribute('transform', 'rotate(' + ang(K.v).toFixed(1) + ' 66 66)');
  const knob = $('knob');
  knob.setAttribute('aria-valuenow', String(K.v));
  knob.setAttribute('aria-valuemax', '100');
  knob.setAttribute('aria-valuetext', 'Volume ' + K.v);
  $('volLbl').textContent = 'VOLUME · ' + (status && status.volume == null && !K.lastUser ? '—' : K.v);
}
function setVol(v){
  v = Math.round(Math.max(0, Math.min(100, v)));
  K.lastUser = Date.now();
  if (v === K.v) return;
  K.v = v; paintKnob();
  if (!K.timer) K.timer = setTimeout(flushVol, 140);
}
async function flushVol(){
  K.timer = null;
  if (K.sent === K.v) return;
  K.sent = K.v;
  try {
    const r = await api('POST', '/api/volume', {value:K.v});
    if (!r.ok) toast((r.json && r.json.error) || 'Volume didn’t change.', true);
  } catch (_) { toast('Couldn’t reach the radio.', true); }
}
(function bindKnob(){
  const knob = $('knob');
  const angleOf = e => { const b = knob.getBoundingClientRect(); const dx = e.clientX - (b.left + b.width / 2), dy = e.clientY - (b.top + b.height / 2);
    return {a: Math.atan2(dx, -dy) * 180 / Math.PI, d: Math.hypot(dx, dy) * 132 / b.width}; };
  let acc = 0;
  knob.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    K.drag = true; acc = K.v; K.ang = angleOf(e).a;
    try { knob.setPointerCapture(e.pointerId); } catch (_) {}
    knob.focus({preventScroll:true});
    e.preventDefault();
  });
  knob.addEventListener('pointermove', e => {
    if (!K.drag) return;
    const {a, d} = angleOf(e);
    if (d < 12){ K.ang = a; return; }
    let delta = a - K.ang; if (delta > 180) delta -= 360; if (delta < -180) delta += 360;
    K.ang = a;
    acc = Math.max(0, Math.min(100, acc + delta * 100 / 270));
    setVol(acc);
  });
  const up = () => { if (!K.drag) return; K.drag = false; K.lastUser = Date.now(); clearTimeout(K.timer); flushVol(); };
  knob.addEventListener('pointerup', up);
  knob.addEventListener('pointercancel', up);
  knob.addEventListener('wheel', e => { e.preventDefault(); setVol(K.v + (e.deltaY < 0 ? 2 : -2)); }, {passive:false});
  knob.addEventListener('keydown', e => {
    const m = {ArrowUp:2, ArrowRight:2, ArrowDown:-2, ArrowLeft:-2, PageUp:10, PageDown:-10}[e.key];
    if (m != null){ e.preventDefault(); setVol(K.v + m); }
    else if (e.key === 'Home'){ e.preventDefault(); setVol(0); }
    else if (e.key === 'End'){ e.preventDefault(); setVol(100); }
  });
})();
function syncKnob(){
  if (!status) return;
  if (status.volume_limit != null) K.limit = Math.max(1, Math.min(100, +status.volume_limit));
  if (!K.drag && Date.now() - K.lastUser > 1500 && status.volume != null){ K.v = Math.min(100, Math.round(status.volume)); K.sent = K.v; }
  paintKnob();
}

function paintTone(){

/* ================= router ================= */
let route = {view:'remote', arg:null, arg2:null}, prevHash = location.hash;
function parseHash(){
  const p = location.hash.replace(/^#\/?/, '').split('/');
  return {view: ['edit','browse','settings','ha'].includes(p[0]) ? p[0] : 'remote', arg: p[1] || null, arg2: p[2] || null};
}
function go(hash){ if (location.hash.replace(/^#/, '') === hash) onRoute(); else location.hash = hash; }
function onRoute(){
  const next = parseHash();
  if (route.view === 'edit' && next.view !== 'edit' && isDirty()){
    if (!confirm('Leave without saving your key changes?')){ history.replaceState(null, '', prevHash || '#edit'); return; }
    errs = {}; hints = {}; general = []; adopt(cfg);
  }
  const changed = next.view !== route.view;
  route = next; prevHash = location.hash; view = next.view;
  $('app').dataset.view = view;
  if (view === 'edit'){
    ed.key = next.arg && cfg && cfg.keys.some(k => k.id === next.arg) ? next.arg : (changed ? null : ed.key);
    ed.pick = next.arg2 === 'hold' || next.arg2 === 'tap' ? next.arg2 : null; ed.ent = null; ed.rename = false;
  }
  renderPanel();
  if (view === 'remote'){ stripSig = ''; renderRemote(); }
  if (changed && (view === 'ha' || view === 'settings')) refreshHa();
  if (changed && view === 'settings') loadSettings().then(() => { if (view === 'settings') rerender(); });
  if (changed && view === 'edit' && cfg && !isDirty()) refreshConfig();
  if (changed){
    window.scrollTo(0, 0);
    const f = view === 'remote' ? null : $('panel').querySelector('[data-focus]');
    if (f) f.focus({preventScroll:true});
  }
}
window.addEventListener('hashchange', onRoute);

// Re-render the panel without losing the caret in the field being typed in.
function rerender(){

/* ---------- radio: station search ---------- */
function radioSection(body, k, p){
  const key = 'r:' + k.id;
  const st = ytmUi[key] || (ytmUi[key] = {q:'', results:null, msg:''});
  const inp = h('input', {type:'search', id:'stq', value: st.q, placeholder:'Search stations or paste a stream link', enterkeyhint:'search',
    autocomplete:'off', autocapitalize:'off', spellcheck:'false', 'aria-label':'Search radio stations', 'aria-controls':'stres', 'aria-describedby':'ststat uriErr'});
  const stat = h('p', {class:'stat', id:'ststat', 'aria-live':'polite'});
  const list = h('ul', {class:'results', id:'stres', 'aria-label':'Stations'});
  let timer = null, ctl = null;
  const paint = () => {
    if (!inp.isConnected) return;
    stat.textContent = st.msg || '';
    list.textContent = '';
    const q = inp.value.trim();
    if (/^https?:\/\/\S+$/i.test(q)){
      list.append(h('li', null, resRow({title:'Use this stream link', sub:q, thumb:'', radio:true, picked:false}, () => pickInto(k, {uri:q, name: p.name || 'My station', radio:true}))));
      return;
    }
    for (const s of st.results || []){
      const sub = [s.genre, s.country].filter(Boolean).join(' · ');
      list.append(h('li', null, resRow({title:s.name, sub, radio:true, picked: (p.uri || '').trim() === s.url},
        () => { stationMeta.set(s.url, s); pickInto(k, {uri:s.url, name:s.name, radio:true}); },
        () => playNow({name:s.name, source:'radio', uri:s.url}, stat))));
    }
  };
  const search = async q => {
    if (ctl) ctl.abort();
    const mine = ctl = new AbortController();
    st.msg = 'Searching…'; paint();
    try {
      const r = await api('GET', '/api/stations?q=' + encodeURIComponent(q), undefined, {signal: mine.signal});
      if (!r.ok || !Array.isArray(r.json)){ st.results = null; st.msg = 'Station search isn’t available right now — paste a stream link instead.'; paint(); return; }
      st.results = r.json.filter(s => s && s.url).slice(0, 40);
      st.msg = st.results.length ? '' : 'No stations found. You can also paste a stream link.';
      paint();
    } catch (e) { if (e.name !== 'AbortError'){ st.msg = 'Couldn’t reach the station list.'; paint(); } }
  };
  inp.addEventListener('input', () => {
    clearTimeout(timer); st.q = inp.value;
    const q = inp.value.trim();
    if (q.length < 2 || /^https?:/i.test(q)){ if (ctl) ctl.abort(); st.results = null; st.msg = ''; paint(); return; }
    timer = setTimeout(() => search(q), 250);
  });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); const f = list.querySelector('.res'); if (f && /^https?:/i.test(inp.value.trim())) f.click(); } });
  body.append(h('div', {class:'searchbox'}, IC.search(), inp), stat, list);
  paint();
}
function resRow(it, onPick, onPlay){
  const th = h('span', {class:'thumb sm' + (it.thumb ? '' : it.radio ? ' radio' : ' blank'), 'aria-hidden':'true'}, it.thumb ? null : it.radio ? IC.radio('#7A5E38', 18) : IC.note());

async function playNow(preset, stat){

  const old = k[slot];

function baseCfgPreset(k, slot){

    if (!ents.length){ list.append(h('p', {class:'hint', style:'padding:10px'}, q ? 'Nothing matches “' + ed.entQ.trim() + '”.' : 'This Home Assistant has nothing of that kind.')); return; }
    for (const g of groupByArea(ents)){

  return groups;
}

/* ---------- test / save ---------- */
async function testPreset(p){
  const btn = $('testBtn');
  if (!(p.uri || '').trim()){ saveMsg = {text:'Choose something to play first.', bad:true}; rerender(); return; }
  if (btn){ btn.disabled = true; btn.textContent = 'Tuning in…'; }
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await api('POST', '/api/play', {preset:{name:(p.name || '').trim() || 'Test', source:p.source, uri:p.uri.trim(), shuffle: p.source !== 'radio' && !!p.shuffle}}, {signal: ctl.signal});
    if (r.json && r.json.ok){ saveMsg = {text:'Playing on the radio.', bad:false}; }
    else saveMsg = {text:(r.json && r.json.error) || 'Couldn’t play that (error ' + r.status + ').', bad:true};
  } catch (e) { saveMsg = {text: e.name === 'AbortError' ? 'The radio took too long to answer.' : 'Couldn’t reach the radio.', bad:true}; }
  clearTimeout(t); rerender(); pollSoon();
}
async function save(){
  if (saving || !isDirty()) return;
  saving = true; saveMsg = {text:'', bad:false}; rerender();
  const body = payload(draft); lastSent = body;
  const label = ed.key ? keyLabel(draft.keys.find(k => k.id === ed.key)) : 'Keys';
  try {
    const r = await api('PUT', '/api/config', body);
    if (r.ok && r.json && r.json.ok){
      errs = {}; hints = {}; general = [];
      adopt(r.json.config || Object.assign({}, cfg, body));
      saveMsg = {text: label + ' saved to the radio.', bad:false};
      toast(label + ' saved');
      buildBank();
      refreshHa();
    } else if (r.json && Array.isArray(r.json.errors) && r.json.errors.length){
      applyServerErrors(r.json.errors);
      const cur = draft.keys.find(k => k.id === ed.key);
      if (!cur || !keyErrCount(cur)){ const first = draft.keys.find(k => keyErrCount(k) > 0); if (first){ ed.key = first.id; history.replaceState(null, '', '#edit/' + first.id); } }
      const bad = draft.keys.filter(k => keyErrCount(k)).map(keyLabel);
      saveMsg = {text:'Not saved — ' + (bad.length ? 'check ' + bad.join(', ') : 'see the message above') + '.', bad:true};
    } else {
      general = [(r.json && (r.json.error || r.json.message)) || 'Saving failed (error ' + r.status + ').'];
      saveMsg = {text:'Not saved.', bad:true};
    }
  } catch (_) { saveMsg = {text:'Couldn’t reach the radio. Check you’re on the same Wi-Fi and try again.', bad:true}; }
  saving = false; rerender();
  const el = $('panel').querySelector('.err, .alert'); if (el && saveMsg.bad) el.scrollIntoView({block:'center', behavior: reduced.matches ? 'auto' : 'smooth'});
}

/* ================= change a key from elsewhere (Browse, HA) ================= */
async function applyToKey(mutate, okMsg){
  try {
    const g = await api('GET', '/api/config');
    if (!g.ok || !g.json || !Array.isArray(g.json.keys)) throw new Error('config');
    const base = {keys: clone(g.json.keys), presets: clone(g.json.presets || [])};
    mutate(base);
    const body = payload(base);
    const r = await api('PUT', '/api/config', body);
    if (r.ok && r.json && r.json.ok){
      const wasDirty = isDirty(), keep = draft;
      adopt(r.json.config || Object.assign({}, g.json, body));
      if (wasDirty && keep){ mutate(keep); draft = keep; }
      buildBank(); renderRemote(); refreshHa();
      toast(okMsg);
      return true;
    }
    const e = r.json && ((r.json.errors && r.json.errors[0] && r.json.errors[0].message) || r.json.error);
    toast('Not saved — ' + (e || 'error ' + r.status), true);
  } catch (_) { toast('Couldn’t reach the radio.', true); }
  return false;
}
function putItemOnKey(item, keyId){
  const k0 = cfg && cfg.keys.find(k => k.id === keyId);
  const name = (item.name || item.title || '').trim() || 'Untitled';
  return applyToKey(d => {
    const k = d.keys.find(x => x.id === keyId);
    const fields = {name, source:item.source, uri:item.uri, shuffle: item.type === 'playlist'};
    let p = k.tap && k.tap.do === 'preset' && refCount(d, k.tap.n) === 1 ? presetIn(d, k.tap.n) : null;
    if (p) Object.assign(p, fields);
    else { p = Object.assign({n: nextFreeN(d)}, fields); d.presets.push(p); k.tap = {do:'preset', n:p.n}; }
  }, name + ' is on ' + (k0 ? keyLabel(k0).replace(/^Key/, 'key') : keyId));
}

/* ================= browse ================= */
let browseLoading = false;
async function loadBrowse(force){
  if (browseLoading || (browseData && !force)) return;
  browseLoading = true; browseErr = '';
  try {
    const r = await api('GET', '/api/browse');
    if (r.ok && r.json) browseData = r.json;
    else browseErr = r.status === 404 ? 'none' : ((r.json && r.json.error) || 'Couldn’t load the catalogue.');
  } catch (_) { browseErr = 'Couldn’t reach the radio.'; }

}
function renderBrowse(){
  const panel = $('panel'); panel.textContent = '';

      h('button', {type:'button', class:'btn small', style:'margin-top:12px', onclick: () => { browseData = null; browseErr = ''; renderBrowse(); }}, 'Try again')));
    return;

  for (const sec of browseData.sections){

    const cards = h('ul', {class:'cards', 'aria-labelledby':hid});

        h('li', null, 'Go to the ', h('b', null, 'Security'), ' tab.'),
        h('li', null, 'Under ', h('b', null, 'Long-lived access tokens'), ', press ', h('b', null, 'Create token'), '.'),
        h('li', null, 'Name it ', h('b', null, '“Hasler”'), ', then copy the token and paste it here.'))),
    h('div', null, h('button', {type:'button', class:'btn primary small inline', disabled: haUi.busy, onclick: haConnect}, haUi.busy ? 'Connecting…' : 'Connect'))));
}
async function haDiscover(){
  haUi.finding = true; rerender();
  try {
    const r = await api('GET', '/api/ha/discover');
    haUi.found = r.ok && r.json && Array.isArray(r.json.instances) ? r.json.instances : [];
    haUi.note = (r.json && r.json.note) || '';
    if (haUi.found.length === 1 && !haUi.url) haUi.url = haUi.found[0].url;
  } catch (_) { haUi.found = []; haUi.note = 'Couldn’t reach the radio.'; }
  haUi.finding = false; rerender();
}
async function haConnect(){
  haUi.urlErr = ''; haUi.tokErr = '';
  if (!haUi.url.trim()){ haUi.urlErr = 'Enter the address, or press Find Home Assistant.'; rerender(); $('haUrl').focus(); return; }
  if (!haUi.token.trim() && !(haState && haState.configured && haUi.url.trim() === haState.url)){ haUi.tokErr = 'Paste a long-lived access token.'; rerender(); $('haTok').focus(); return; }
  haUi.busy = true; rerender();
  try {
    const r = await api('POST', '/api/ha', {url: haUi.url.trim(), token: haUi.token.trim()});
    haUi.busy = false;
    if (r.ok && r.json && r.json.connected !== false && r.json.ok !== false){
      haState = r.json; haUi.token = ''; haEnts = null;
      toast('Connected to Home Assistant');
      await loadEntities(); await refreshHa();
      return;
    }
    const m = (r.json && r.json.error) || 'Couldn’t connect (error ' + r.status + ').';
    if (/token|reject|auth|401|403|denied|invalid/i.test(m)) haUi.tokErr = m; else haUi.urlErr = m;
  } catch (_) { haUi.busy = false; haUi.urlErr = 'Couldn’t reach the radio.'; }
  rerender();
  const f = $(haUi.tokErr ? 'haTok' : 'haUrl'); if (f) f.focus();
}
async function haDisconnect(){
  if (!confirm('Disconnect Home Assistant? Keys that use it will do nothing until you connect again.')) return;
  try {
    const r = await api('DELETE', '/api/ha');
    if (r.ok){ haState = r.json && typeof r.json === 'object' && 'connected' in r.json ? r.json : {configured:false, connected:false}; haEnts = null; toast('Disconnected'); refreshHa(); }
    else toast((r.json && r.json.error) || 'Couldn’t disconnect.', true);
  } catch (_) { toast('Couldn’t reach the radio.', true); }
  rerender();
}
function haConnected(panel){
  panel.append(h('section', {class:'card-box'},
    h('span', {class:'mono'}, 'Home Assistant'),
    h('h3', null, h('span', {class:'status-dot', 'aria-hidden':'true'}), 'Connected to ' + (haState.location || 'Home Assistant')),
    h('p', {class:'body'}, [haState.version ? 'HA ' + haState.version : '', haState.url || ''].filter(Boolean).join(' · ')),
    h('label', {class:'switch', for:'haPub'}, h('span', null, 'Show the radio in Home Assistant', h('br'), h('small', {class:'li-sub'}, 'What’s playing, as sensor.hasler_radio')),
      h('input', {type:'checkbox', role:'switch', id:'haPub', checked: !!haState.publish, onchange: e => haPublish(e.target.checked)})),
    h('div', null, h('button', {type:'button', class:'link danger', onclick: haDisconnect}, 'Disconnect'))));
  const head = h('div', {class:'shelf-head', style:'display:flex;justify-content:space-between;align-items:end;gap:10px;margin-top:6px'},
    h('div', null, h('h2', null, 'What Hasler can use'), h('p', null, 'Try it here, or put it on a key.')),
    h('button', {type:'button', class:'btn small inline', id:'haRefresh', onclick: async () => { const b = $('haRefresh'); if (b){ b.disabled = true; b.textContent = 'Refreshing…'; } await loadEntities(true); rerender(); }}, 'Refresh'));
  panel.append(head);
  if (!haEnts){
    if (haEntsErr) panel.append(h('p', {class:'err'}, haEntsErr));
    else { panel.append(h('p', {class:'loading'}, 'Asking Home Assistant…')); loadEntities().then(() => { if (view === 'ha') rerender(); }); }
    return;
  }
  const useful = new Set(HA_DOMAINS.concat(((cfg && cfg.verbs) || []).flatMap(v => v.domains || [])));
  const ents = haEnts.entities.filter(e => useful.has(e.domain));
  if (!ents.length){ panel.append(h('div', {class:'empty'}, h('p', null, 'This Home Assistant has no scenes, scripts, lights or switches Hasler can use yet.'))); return; }
  const list = h('div', {class:'list'});
  for (const g of groupByArea(ents)){
    list.append(h('div', {class:'area-h'}, g.name));
    for (const e of g.items){
      const verb = domainVerb(e.domain);
      list.append(h('div', {class:'ent'},
        h('div', {class:'ent-txt'}, h('span', {class:'ent-name'}, e.name), h('span', {class:'ent-sub'}, e.domain.replace('_', ' ') + (e.state ? ' · ' + e.state : ''))),
        h('button', {type:'button', class:'btn small inline', 'aria-label':'Try it: ' + e.name, onclick: ev => haTry(verb, e, ev.currentTarget)}, 'Try it'),
        h('button', {type:'button', class:'btn small inline', 'aria-label':'Put ' + e.name + ' on a key', onclick: () => haPutOnKey(verb, e)}, h('span', {'aria-hidden':'true'}, '+'), 'Key')));
    }
  }
  panel.append(list);
}
async function haPublish(on){
  try {
    const r = await api('PATCH', '/api/ha', {publish:on});
    if (r.ok && r.json){ haState = Object.assign(haState || {}, r.json); toast(on ? 'Sharing what’s playing with Home Assistant' : 'Stopped sharing'); }
    else { toast((r.json && r.json.error) || 'Couldn’t change that.', true); rerender(); }
  } catch (_) { toast('Couldn’t reach the radio.', true); rerender(); }
}
async function haTry(verb, e, btn){
  if (btn){ btn.disabled = true; }
  try {
    const r = await api('POST', '/api/ha/try', {do:verb, entity:e.entity_id});
    if (r.ok && (!r.json || r.json.ok !== false)) toast(verbShort(verb) + ' · ' + e.name);
    else toast((r.json && r.json.error) || 'Home Assistant didn’t do it.', true);
  } catch (_) { toast('Couldn’t reach the radio.', true); }
  if (btn) btn.disabled = false;
}
async function haPutOnKey(verb, e){
  if (!cfg){ toast('Still loading the keys — try again in a moment.', true); return; }
  const c = await chooseKey({title:'Put “' + e.name + '” on a key', sub: verbShort(verb) + ' · ' + e.entity_id + '. Holding is usually best — the tap keeps playing music.', slots:true, defaultSlot:'hold', allowPu:true});
  if (!c) return;
  const k0 = cfg.keys.find(k => k.id === c.key);
  applyToKey(d => { const k = d.keys.find(x => x.id === c.key); k[c.slot] = {do:verb, entity:e.entity_id}; },
    e.name + ' is on ' + keyLabel(k0).replace(/^Key/, 'key') + ' · ' + c.slot);
}

/* ================= polling ================= */
let pollTimer = null, polling = false;
async function poll(){
  if (polling) return; polling = true;
  try {
    const r = await api('GET', '/api/status');
    if (r.ok && r.json){ status = r.json; online = true; } else online = false;
  } catch (_) { online = false; }
  polling = false;
  renderRemote();
}
function schedule(){
  clearTimeout(pollTimer); pollTimer = null;
  if (document.hidden) return;
  pollTimer = setTimeout(async () => { await poll(); schedule(); }, 1000);
}
function pollSoon(){ clearTimeout(pollTimer); pollTimer = setTimeout(async () => { await poll(); schedule(); }, 250); }
document.addEventListener('visibilitychange', () => { if (document.hidden){ clearTimeout(pollTimer); pollTimer = null; } else { poll().then(schedule); } });

/* ================= boot ================= */
// Pick up changes made elsewhere (another phone, Browse) before editing.
async function refreshConfig(){
  try {
    const r = await api('GET', '/api/config');
    if (r.ok && r.json && Array.isArray(r.json.keys) && !isDirty() && JSON.stringify(r.json) !== JSON.stringify(cfg)){ adopt(r.json); buildBank(); if (view === 'edit') rerender(); }
  } catch (_) {}
}
async function loadConfig(){
  try {
    const r = await api('GET', '/api/config');
    if (!r.ok || !r.json || !Array.isArray(r.json.keys)) throw new Error('bad');
    adopt(r.json);
  } catch (_) { cfg = cfg || undefined; }
  buildBank(); renderRemote();
  if (view === 'edit'){ onRoute(); }
}
window.addEventListener('beforeunload', e => { if (isDirty()){ e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 's' && view === 'edit'){ e.preventDefault(); save(); } });

paintKnob();
onRoute();
poll().then(schedule);
loadConfig();
loadAccount();
loadSettings().then(() => { if (view === 'settings') rerender(); if (settings && settings.volume_limit != null){ K.limit = +settings.volume_limit; paintKnob(); } });
refreshHa();
})();
</script>
