r="middle" fill="#9FB8A2">18</text><rect x="791" y="241" width="18" height="18" fill="#C9B26A"/><text x="800" y="220" font-size="13" text-anchor="middle" fill="#9FB8A2">19</text><rect x="791" y="311" width="18" height="18" fill="#C9B26A"/><text x="800" y="362" font-size="13" text-anchor="middle" fill="#9FB8A2">20</text><rect x="861" y="241" width="18" height="18" fill="#C9B26A"/><text x="870" y="220" font-size="13" text-anchor="middle" fill="#9FB8A2">21</text><rect x="861" y="311" width="18" height="18" fill="#C9B26A"/><text x="870" y="362" font-size="13" text-anchor="middle" fill="#9FB8A2">22</text><rect x="931" y="241" width="18" height="18" fill="#C9B26A"/><text x="940" y="220" font-size="13" text-anchor="middle" fill="#9FB8A2">23</text><rect x="931" y="311" width="18" height="18" fill="#C9B26A"/><text x="940" y="362" font-size="13" text-anchor="middle" fill="#9FB8A2">24</text><rect x="1001" y="241" width="18" height="18" fill="#C9B26A"/><text x="1010" y="220" font-size="13" text-anchor="middle" fill="#9FB8A2">25</text><rect x="1001" y="311" width="18" height="18" fill="#C9B26A"/><text x="1010" y="362" font-size="13" text-anchor="middle" fill="#9FB8A2">26</text><text x="740" y="400" font-size="14" fill="#9FB8A2" text-anchor="start">17–26: expansion, empty on the HM</text><text x="120" y="256" font-size="14" fill="#9FB8A2" text-anchor="end">odd</text><text x="120" y="326" font-size="14" fill="#9FB8A2" text-anchor="end">even</text><text x="60" y="450" font-size="18" fill="#EFE6D2" text-anchor="start" font-weight="700">Row nearer header P (odd pins 1, 3 … 15), left to right:</text><rect x="60" y="466" width="36" height="24" rx="4" fill="#F4F1EA" stroke="#000"/><text x="104" y="484" font-size="15" fill="#EFE6D2" text-anchor="start">white</text><rect x="210" y="466" width="36" height="24" rx="4" fill="#7A4A25" stroke="#000"/><text x="254" y="484" font-size="15" fill="#EFE6D2" text-anchor="start">brown</text><rect x="360" y="466" width="36" height="24" rx="4" fill="#F08A24" stroke="#000"/><text x="404" y="484" font-size="15" fill="#EFE6D2" text-anchor="start">orange</text><rect x="510" y="466" width="36" height="24" rx="4" fill="#2FA84F" stroke="#000"/><text x="554" y="484" font-size="15" fill="#EFE6D2" text-anchor="start">green</text><rect x="660" y="466" width="36" height="24" rx="4" fill="#8E4FC9" stroke="#000"/><text x="704" y="484" font-size="15" fill="#EFE6D2" text-anchor="start">purple</text><rect x="810" y="466" width="36" height="24" rx="4" fill="#F4F1EA" stroke="#000"/><text x="854" y="484" font-size="15" fill="#EFE6D2" text-anchor="start">white</text><rect x="960" y="466" width="36" height="24" rx="4" fill="#7A4A25" stroke="#000"/><text x="1004" y="484" font-size="15" fill="#EFE6D2" text-anchor="start">brown</text><rect x="1110" y="466" width="36" height="24" rx="4" fill="#F08A24" stroke="#000"/><text x="1154" y="484" font-size="15" fill="#EFE6D2" text-anchor="start">orange</text><text x="60" y="540" font-size="18" fill="#EFE6D2" text-anchor="start" font-weight="700">Row nearer the green board (even pins 2, 4 … 16), left to right:</text><rect x="60" y="556" width="36" height="24" rx="4" fill="#1A1A1A" stroke="#000"/><text x="104" y="574" font-size="15" fill="#EFE6D2" text-anchor="start">black</text><rect x="210" y="556" width="36" height="24" rx="4" fill="#E03A30" stroke="#000"/><text x="254" y="574" font-size="15" fill="#EFE6D2" text-anchor="start">red</text><rect x="360" y="556" width="36" height="24" rx="4" fill="#F2D21B" stroke="#000"/><text x="404" y="574" font-size="15" fill="#EFE6D2" text-anchor="start">yellow</text><rect x="510" y="556" width="36" height="24" rx="4" fill="#2F6FE0" stroke="#000"/><text x="554" y="574" font-size="15" fill="#EFE6D2" text-anchor="start">blue</text><rect x="660" y="556" width="36" height="24" rx="4" fill="#9A9A9A" stroke="#000"/><text x="704" y="574" font-size="15" fill="#EFE6D2" text-anchor="start">grey</text><rect x="810" y="556" width="36" height="24" rx="4" fill="#1A1A1A" stroke="#000"/><text x="854" y="574" font-size="15" fill="#EFE6D2" text-anchor="start">black</text><rect x="960" y="556" width="36" height="24" rx="4" fill="#E03A30" stroke="#000"/><text x="1004" y="574" font-size="15" fill="#EFE6D2" text-anchor="start">red</text><rect x="1110" y="556" width="36" height="24" rx="4" fill="#F2D21B" stroke="#000"/><text x="1154" y="574" font-size="15" fill="#EFE6D2" text-anchor="start">yellow</text><text x="60" y="640" font-size="18" fill="#FFB238" text-anchor="start" font-weight="700">The one thing to check: WHITE on pin 1 (corner, P side) with BLACK directly opposite it on the green-board side.</text><text x="60" y="670" font-size="16" fill="#B9B0A0" text-anchor="start">If black sits on the P side and white on the green-board side, the plug is mirrored: press it onto the cable from the other face.</text><text x="60" y="696" font-size="14" fill="#8A8378" text-anchor="start">Signals: 1 GND · 2 K1 · 3 K2 · 4 K3 · 5 K4 · 6 K5 · 7 K6 · 8 PU</text><text x="60" y="718" font-size="14" fill="#8A8378" text-anchor="start">         9 TONE wiper · 10 VOL wiper · 11 POT+ / LED+ · 12 POT− · 13 TONE sw · 14 LED R · 15 LED G · 16 LED B</text></g></svg>