# The makers' check-in endpoint (worker.js): one Worker, one KV namespace.
# README.md has the steps; nothing here is deployed by the repo.
name = "hasler-checkin"
main = "worker.js"
compatibility_date = "2026-10-01"

# `wrangler kv namespace create CHECKINS` prints the id to put here.
[[kv_namespaces]]
binding = "CHECKINS"
id = "b565f44ec14643329addafd897860286"

# Optional. Set as secrets instead of here (`wrangler secret put CHECKIN_TOKEN`,
# `wrangler secret put DASHBOARD_KEY`); listed so the names are in one place.
# [vars]
# CHECKIN_TOKEN = ""
# DASHBOARD_KEY = ""

# "Send to the makers" (support.js; SUPPORT.md has the steps). Its own namespace,
# so the dashboard's list stays radios only: `wrangler kv namespace create SUPPORT`.
# Secrets: `wrangler secret put GITHUB_TOKEN`, `wrangler secret put GITHUB_WEBHOOK_SECRET`.
[[kv_namespaces]]
binding = "SUPPORT"
id = "7dd7e157753c4a648d8e3522fc554525"

[vars]
SUPPORT_REPO = "Delgado-Murphy/hasler-support"
# Each radio's own word (enrol.js): at most this many new radios an hour, and reports made with
# radios' own words across all radios a day. Defaults when left out: 30 and 200.
# ENROL_PER_HOUR = "30"
# REPORTS_ALL_PER_DAY = "200"
# The links in alert issues (alerts.js). ALERTS = "off" mutes the alert issues altogether.
DASHBOARD_URL = "https://hasler-checkin.delgado-murphy.workers.dev"
# ALERTS = "off"

# The daily job (worker.js scheduled -> daily): yesterday's anonymous fleet roll-up (fleet:<date>,
# 400 days), records not seen for 90 days deleted, the quiet / YouTube / trend alerts.
# Free plan: cron triggers are included; this one does 1 KV write + one per forgotten radio + alerts.
[triggers]
crons = ["0 6 * * *"]
